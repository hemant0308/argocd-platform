apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hemant0308/argocd-platform.git
    targetRevision: main
    path: argocd/managed
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true