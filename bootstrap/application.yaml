apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hemant0308/argocd-platform.git
    targetRevision: main
    path: argocd/managed
    helm:
      valuesObject:
        releaseName: managed-argocd
      # Default values live at argocd/managed/values.yaml (auto-loaded by Helm).
      # Pass environment overrides via valuesObject or additional valueFiles here.

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
