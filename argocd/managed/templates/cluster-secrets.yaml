{{- /*
  Generates one ArgoCD cluster registration resource per entry in .Values.clusters.

  Supported secretType values:

    direct   — Kubernetes Secret with credentials inline in values.
               Safe for local dev only. Never commit real tokens.

    sealed   — SealedSecret (bitnami.com/v1alpha1).
               Encrypted values produced by kubeseal are safe to commit.
               Requires the Sealed Secrets controller on the cluster.

    external — ExternalSecret (external-secrets.io/v1beta1).
               Credentials remain in an external store (Vault, AWS SSM, etc.).
               Requires the External Secrets Operator on the cluster.

  All three types emit the ArgoCD cluster labels so the Cluster Generator
  and the control-plane ApplicationSet can discover the registered clusters.
*/ -}}
{{- range .Values.clusters }}
---
{{- if eq .secretType "direct" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    argocd-platform/control-plane: "true"
type: Opaque
stringData:
  name: {{ .name }}
  server: {{ .server }}
  config: |
    {
      "bearerToken": {{ .direct.bearerToken | quote }},
      "tlsClientConfig": {
        "insecure": {{ .direct.tlsClientConfig.insecure }},
        "caData": {{ .direct.tlsClientConfig.caData | quote }}
      }
    }

{{- else if eq .secretType "sealed" }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    # Restrict decryption to this namespace so the sealed values cannot be
    # reused in other namespaces on the same cluster.
    sealedsecrets.bitnami.com/namespace-wide: "true"
spec:
  encryptedData:
    name: {{ .sealed.encryptedData.name | quote }}
    server: {{ .sealed.encryptedData.server | quote }}
    config: {{ .sealed.encryptedData.config | quote }}
  template:
    metadata:
      name: {{ .name }}
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: cluster
        argocd-platform/control-plane: "true"
    type: Opaque

{{- else if eq .secretType "external" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: argocd
spec:
  refreshInterval: {{ .external.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .external.secretStore | quote }}
    kind: {{ .external.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ .name }}
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          argocd-platform/control-plane: "true"
  # dataFrom.extract pulls all fields from a single secret path in the store.
  # The store entry must contain keys: name, server, config
  # where config is the ArgoCD cluster config JSON (bearerToken + tlsClientConfig).
  dataFrom:
    - extract:
        key: {{ .external.secretPath | quote }}

{{- else }}
  {{- fail (printf "clusters[%s].secretType must be one of: direct, sealed, external — got %q" .name .secretType) }}
{{- end }}
{{- end }}
