apiVersion: v1
kind: Secret
metadata:
  name: argocd-platform-plugin-secret
  namespace: argocd
type: Opaque
stringData:
  # Token sent by ArgoCD as "Authorization: Bearer <token>" to the plugin service.
  # Override plugin.token in your environment values file with a strong random string.
  # Generate one with: openssl rand -hex 32
  token: {{ .Values.plugin.token | quote }}
