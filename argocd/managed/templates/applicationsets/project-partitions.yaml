apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: project-partitions
  namespace: argocd

spec:
  generators:
    - plugin:
        configMapRef:
          name: argocd-platform-plugin
        input:
          parameters:
            resource: "project-partitions"
        requeueAfterSeconds: {{ .Values.requeueAfterSeconds.projectPartitions }}

  template:
    metadata:
      name: 'project-partition-{{`{{partitionNumber}}`}}'
      annotations:
        argocd-platform/generation: '{{`{{generation}}`}}'
        argocd-platform/project-count: '{{`{{projectCount}}`}}'

    spec:
      project: default

      source:
        repoURL: {{ .Values.git.repoURL | quote }}
        targetRevision: {{ .Values.git.targetRevision | quote }}
        path: charts/project-partition
        helm:
          valuesObject:
            # Partition identity — passed through to the inner ApplicationSet
            # so the project-groups plugin knows which partition to query.
            partitionNumber: '{{`{{partitionNumber}}`}}'
            # Generation bumps whenever partition membership changes in the DB,
            # forcing this Application to re-sync and re-render the inner AppSet.
            generation: '{{`{{generation}}`}}'

      # Deploy to the managed ArgoCD cluster itself — the chart renders an
      # ApplicationSet resource that lives on the managed control plane.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
