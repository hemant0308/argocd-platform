apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-partitions
  namespace: argocd

spec:
  generators:
    - plugin:
        configMapRef:
          name: argocd-platform-plugin
        input:
          parameters:
            resource: "cluster-partitions"
        requeueAfterSeconds: {{ .Values.requeueAfterSeconds.clusterPartitions }}

  template:
    metadata:
      name: 'cluster-partition-{{`{{partitionNumber}}`}}'
      annotations:
        argocd-platform/generation: '{{`{{generation}}`}}'
        argocd-platform/cluster-count: '{{`{{clusterCount}}`}}'

    spec:
      project: default

      source:
        repoURL: {{ .Values.git.repoURL | quote }}
        targetRevision: {{ .Values.git.targetRevision | quote }}
        path: charts/cluster-partition
        helm:
          valuesObject:
            # Partition identity — passed through to the inner ApplicationSet
            # so the cluster-groups plugin knows which partition to query.
            partitionNumber: '{{`{{partitionNumber}}`}}'
            # Generation bumps whenever partition membership changes in the DB,
            # forcing this Application to re-sync and re-render the inner AppSet.
            generation: '{{`{{generation}}`}}'
            # Poll interval for the inner cluster-groups ApplicationSet.
            # Controlled centrally from argocd/managed values.
            requeueAfterSeconds: {{ .Values.requeueAfterSeconds.clusterGroups }}

      # Deploy to the managed ArgoCD cluster itself — the chart renders an
      # ApplicationSet resource that lives on the managed control plane.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
