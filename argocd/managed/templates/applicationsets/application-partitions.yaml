apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: application-partitions
  namespace: argocd

spec:
  generators:
    - plugin:
        configMapRef:
          name: argocd-platform-plugin
        input:
          parameters:
            resource: "application-partitions"
        requeueAfterSeconds: {{ .Values.requeueAfterSeconds.applicationPartitions }}

  template:
    metadata:
      # Include controlPlaneName so Application names are unique across CPs.
      # Under Option B, partitionNumber restarts per CP, so two CPs can both
      # have partition 1 — the CP suffix makes them distinct ArgoCD Applications.
      name: 'application-partition-{{`{{partitionNumber}}`}}-{{`{{controlPlaneName}}`}}'
      annotations:
        argocd-platform/generation: '{{`{{generation}}`}}'
        argocd-platform/application-count: '{{`{{applicationCount}}`}}'

    spec:
      project: default

      source:
        repoURL: {{ .Values.git.repoURL | quote }}
        targetRevision: {{ .Values.git.targetRevision | quote }}
        path: charts/application-partition
        helm:
          valuesObject:
            # Partition identity — passed through to the inner ApplicationSet
            # so the application-groups plugin knows which partition to query.
            partitionNumber: '{{`{{partitionNumber}}`}}'
            # Generation bumps whenever partition membership changes in the DB,
            # forcing this Application to re-sync and re-render the inner AppSet.
            generation: '{{`{{generation}}`}}'
            # Poll interval for the inner application-groups ApplicationSet.
            # Controlled centrally from argocd/managed values.
            requeueAfterSeconds: {{ .Values.requeueAfterSeconds.applicationGroups }}
            # CP name forwarded to the inner chart so it can pass cpName to the
            # application-groups plugin. Required by Option B (CP-scoped partitions).
            cpName: '{{`{{controlPlaneName}}`}}'

      # Deploy to the managed ArgoCD cluster itself — the chart renders an
      # ApplicationSet resource that lives on the managed control plane.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
