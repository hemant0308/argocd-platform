apiVersion: v1
kind: Secret
metadata:
  name: argocd-platform-plugin-secret
  namespace: argocd
type: Opaque
stringData:
  # Token sent by ArgoCD as "Authorization: Bearer <token>" to the plugin service.
  # Replace this value with a strong random string before deploying to production.
  # Generate one with: openssl rand -hex 32
  token: "argocd-platform-plugin-token"
