# ─────────────────────────────────────────────────────────────────────────────
# Plugin Generator
# ─────────────────────────────────────────────────────────────────────────────
plugin:
  # ArgoCD POSTs to {baseUrl}/api/v1/getparams.execute on every reconcile.
  # Override per environment — this default is for local Docker Desktop only.
  baseUrl: "http://host.docker.internal:8081"
  # Token sent as "Authorization: Bearer <token>" to the plugin service.
  # Generate a strong value with: openssl rand -hex 32
  token: "argocd-platform-plugin-token"

# ─────────────────────────────────────────────────────────────────────────────
# Git source — shared by all partition ApplicationSets
# ─────────────────────────────────────────────────────────────────────────────
git:
  repoURL: "https://github.com/hemant0308/argocd-platform.git"
  targetRevision: "main"

# ─────────────────────────────────────────────────────────────────────────────
# ApplicationSet poll intervals (seconds)
#
# Event-driven reconciliation model:
#   Every resource mutation bumps the affected partition's generation counter.
#   Level 1 polls at 10 s (tiny response: partition numbers + generations only).
#   When Level 1 detects a changed generation it re-renders the Level 2 Application
#   via Helm, which changes the Level 3 ApplicationSet spec
#   (input.parameters.generation) → ArgoCD immediately reconciles Level 3 →
#   Plugin Generator called → fresh data within ~10 s of the original mutation.
#   Level 3's 600 s interval is a pure safety net for missed events.
#
# Level 1 (partition-discovery, argocd/managed):
#   Polls /application-partitions, /cluster-partitions, /project-partitions.
#   Response payload is tiny (partition numbers + generations). 10 s is safe
#   even at 1 000 partitions.
#
# Level 3 (group-discovery, rendered by charts/*-partition):
#   600 s safety-net only — normal reconciliation is event-driven via Level 1.
#   Do NOT lower this without re-evaluating DB query load at peak partition count.
# ─────────────────────────────────────────────────────────────────────────────
requeueAfterSeconds:
  # Level 1 — partition-discovery AppSets (argocd/managed); small payload, poll fast
  clusterPartitions: 10
  projectPartitions: 10
  applicationPartitions: 10
  applicationSetPartitions: 10
  # Level 3 — group-discovery AppSets (charts/*-partition); safety-net only
  clusterGroups: 10
  projectGroups: 10
  applicationGroups: 10
  applicationSetGroups: 10

# ─────────────────────────────────────────────────────────────────────────────
# Control-plane ApplicationSet
# ─────────────────────────────────────────────────────────────────────────────
controlPlanes:
  argocdChartVersion: "10.3.3"

# ─────────────────────────────────────────────────────────────────────────────
# Control-plane cluster registrations
#
# Each entry generates one ArgoCD cluster Secret (or SealedSecret /
# ExternalSecret) in the managed ArgoCD namespace.
#
# secretType: direct | sealed | external
#
#   direct   — plain Kubernetes Secret; credentials live in this values file.
#              Use only for local dev. Never commit real tokens.
#
#   sealed   — SealedSecret (bitnami/sealed-secrets). Encrypted values are
#              safe to commit. Generate with: kubeseal --raw ...
#
#   external — ExternalSecret (external-secrets.io). Credentials stay in an
#              external store (Vault, AWS SSM, Azure KV, etc.).
#              The chart renders the ExternalSecret; the store holds the data.
# ─────────────────────────────────────────────────────────────────────────────
