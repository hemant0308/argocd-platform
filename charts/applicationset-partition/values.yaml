partitionNumber: ""

# Generation — bumped in the DB whenever applicationsets are added to or removed
# from this partition. Embedding it as an annotation on the inner ApplicationSet
# causes ArgoCD to re-sync this chart and re-evaluate the plugin generator.
generation: ""

repoURL: https://github.com/hemant0308/argocd-platform.git
targetRevision: main

# Poll interval (seconds) for the applicationset-groups plugin generator.
# Injected from argocd/managed via the parent ApplicationSet valuesObject.
# Override requeueAfterSeconds.applicationSetGroups in argocd/managed/values.yaml
# to tune for all partitions at once.
requeueAfterSeconds: 30
