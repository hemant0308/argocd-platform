apiVersion: v2
name: applicationset-partition
description: >
  Creates an applicationset-groups ApplicationSet for a single applicationset partition.
  Deployed by the outer applicationset-partition-{N} Application (generated by the
  applicationset-partitions ApplicationSet). The inner ApplicationSet uses goTemplate
  mode to query the plugin generator (resource=applicationset-groups) for applicationsets
  filtered by control plane via project fan-out
  (applicationsets → project → project_clusters → clusters → control_planes),
  then creates one applicationset-registration Application per control plane.
  Control planes with no clusters belonging to the partition's applicationsets are skipped.
type: application
version: 1.0.0
