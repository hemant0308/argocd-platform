{{- /*
  Creates one ArgoCD AppProject per entry in .Values.projects.

  .Values.projects is a JSON array string serialised by the inner
  project-partition ApplicationSet via {{ .projects | toJson }}.

  fromJsonArray (Helm built-in) correctly parses JSON arrays into a Go slice.
  Use this instead of fromJson or fromYaml — both unmarshal into
  map[string]interface{} in Helm 3.x and fail for top-level JSON arrays.

  Inside the range:
    .        = current project item  { name, clusters: [{name, namespaces}] }
    $.Values = chart-level values    { partitionNumber, controlPlane, projects }

  destinations logic:
    - If the project has clusters: one destination entry per cluster.
      - If the cluster has namespaces: one entry per namespace (name+namespace pair).
      - If the cluster has no namespaces: one entry with namespace: '*'.
    - If the project has no clusters: fall back to server: '*' / namespace: '*'
      so the AppProject is valid and can be tightened once clusters are added.
*/ -}}
{{- range fromJsonArray .Values.projects }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .name }}
  namespace: argocd
  labels:
    argocd-platform/partition: "{{ $.Values.partitionNumber }}"
    argocd-platform/control-plane: "{{ $.Values.controlPlane }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Managed by argocd-platform — partition {{ $.Values.partitionNumber }}"
  sourceRepos:
    - '*'
  destinations:
    {{- if .clusters }}
    {{- range .clusters }}
    {{- $clusterName := .name }}
    {{- if .namespaces }}
    {{- range .namespaces }}
    - name: {{ $clusterName | quote }}
      namespace: {{ . | quote }}
    {{- end }}
    {{- else }}
    - name: {{ $clusterName | quote }}
      namespace: '*'
    {{- end }}
    {{- end }}
    {{- else }}
    - namespace: '*'
      server: '*'
    {{- end }}
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
{{- end }}
