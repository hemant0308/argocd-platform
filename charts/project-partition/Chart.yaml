apiVersion: v2
name: project-partition
description: >
  Creates a project-groups ApplicationSet for a single project partition.
  Deployed by the outer project-partition-{N} Application (generated by the
  project-partitions ApplicationSet). The inner ApplicationSet uses goTemplate
  mode to query the plugin generator (resource=project-groups) for projects
  grouped by control plane, then creates one appproject Application per
  control plane. Every CP receives the full project list because AppProjects
  must exist on all control planes.
type: application
version: 1.0.0
