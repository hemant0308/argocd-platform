{{- /*
  Creates one ArgoCD Cluster Secret per entry in .Values.clusters.

  .Values.clusters is a JSON array string serialised by the inner
  cluster-partition ApplicationSet via {{ .clusters | toJson }}.

  fromJsonArray (Helm built-in) correctly parses JSON arrays into a Go slice.

  Inside the range:
    .        = current cluster item  { name, server, config }
    $.Values = chart-level values    { partitionNumber, controlPlane, clusters }

  Config passthrough:
    .config is the ArgoCD Cluster Secret config object stored as free-form JSONB.
    toJson converts the map to a compact JSON string; quote wraps it in YAML
    double-quotes (escaping internal quotes via strconv.Quote semantics) so that
    Kubernetes stringData receives a plain string, not an ambiguous YAML mapping.
    When .config is absent, we emit the literal YAML string "{}" so ArgoCD falls
    back to in-cluster service-account credentials.
*/ -}}
{{- range fromJsonArray .Values.clusters }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    argocd-platform/partition: "{{ $.Values.partitionNumber }}"
    argocd-platform/control-plane: "{{ $.Values.controlPlane }}"
type: Opaque
stringData:
  name: {{ .name | quote }}
  server: {{ .server | quote }}
  config: {{ if .config }}{{ .config | toJson | quote }}{{ else }}"{}"{{ end }}
{{- end }}
