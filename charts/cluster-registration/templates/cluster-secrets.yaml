{{- /*
  Creates one ArgoCD Cluster Secret per entry in .Values.clusters.

  .Values.clusters is a JSON array string serialised by the inner
  cluster-partition ApplicationSet via {{ .clusters | toJson }}.

  fromJsonArray (Helm built-in) correctly parses JSON arrays into a Go slice.

  Inside the range:
    .        = current cluster item  { name, server, config }
    $.Values = chart-level values    { partitionNumber, controlPlane, clusters }

  Config passthrough:
    .config is the ArgoCD Cluster Secret config object built by the plugin service
    from the cluster's stored auth, keyed by AuthType:
      LOCAL_TEST — the full ClusterAuth object serialised as-is
    toJson serialises the map to a JSON string for the stringData.config field.
    When .config is nil (no auth configured), an empty JSON object is used so
    ArgoCD falls back to in-cluster service-account credentials.
*/ -}}
{{- range fromJsonArray .Values.clusters }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    argocd-platform/partition: "{{ $.Values.partitionNumber }}"
    argocd-platform/control-plane: "{{ $.Values.controlPlane }}"
type: Opaque
stringData:
  name: {{ .name }}
  server: {{ .server }}
  config: {{ if .config }}{{ .config | toJson }}{{ else }}{}{{ end }}
{{- end }}
