{{- /*
  Creates one ArgoCD Cluster Secret per entry in .Values.clusters.

  .Values.clusters is a JSON array string serialised by the inner
  cluster-partition ApplicationSet via {{ .clusters | toJson }}.

  fromJsonArray (Helm built-in) correctly parses JSON arrays into a Go slice.
  Use this instead of fromJson or fromYaml — both unmarshal into
  map[string]interface{} in Helm 3.x and fail for top-level JSON arrays.

  Inside the range:
    .        = current cluster item  { name, server }
    $.Values = chart-level values    { partitionNumber, controlPlane, clusters }

  CREDENTIALS PLACEHOLDER
  ───────────────────────
  The plugin returns only name+server for each cluster. The bearerToken and
  caData below are empty placeholders. Fill them before the cluster can be
  used by ArgoCD. Options:

    A) External Secrets Operator — annotate the Secret and let ESO inject
       credentials from Vault / AWS Secrets Manager.
    B) Manual patch after initial sync:
         kubectl patch secret <name> -n argocd --type=merge \
           -p '{"stringData":{"config":"{\"bearerToken\":\"<token>\",\"tlsClientConfig\":{\"insecure\":false,\"caData\":\"<base64>\"}}"}}'
    C) CI/CD pre-sync hook that fetches and injects credentials.

  Until credentials are filled ArgoCD registers the cluster entry but cannot
  sync Applications targeting it.
*/ -}}
{{- range fromJsonArray .Values.clusters }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    argocd-platform/partition: "{{ $.Values.partitionNumber }}"
    argocd-platform/control-plane: "{{ $.Values.controlPlane }}"
type: Opaque
stringData:
  name: {{ .name }}
  server: {{ .server }}
  config: |
    {
      "bearerToken": "",
      "tlsClientConfig": {
        "insecure": false,
        "caData": ""
      }
    }
{{- end }}
