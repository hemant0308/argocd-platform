{{- /*
  Two-layer template escaping
  ───────────────────────────
  Helm processes this file first.  To pass ArgoCD goTemplate tokens through
  unchanged, wrap them in Helm string literals:

    {{ "{{ .controlPlane }}" }}   →  Helm emits  →  {{ .controlPlane }}

  ArgoCD then evaluates the literal using goTemplate (spec.goTemplate: true).

  goTemplate is required because the clusters field is a native JSON array
  from the plugin.  With goTemplate, {{ .clusters | toJson }} serialises it
  to a proper JSON string that Helm receives as .Values.clusters.
  The downstream chart (cluster-registration) parses it back with
  fromJsonArray (Helm built-in that correctly handles JSON arrays, unlike
  fromJson / fromYaml which both unmarshal into map[string]interface{}).
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-partition-{{ .Values.partitionNumber }}-groups-appset
  namespace: argocd
  annotations:
    argocd-platform/partition-number: "{{ .Values.partitionNumber }}"
    argocd-platform/generation: "{{ .Values.generation }}"

spec:
  goTemplate: true

  generators:
    - plugin:
        requeueAfterSeconds: 1
        configMapRef:
          name: argocd-platform-plugin
        input:
          parameters:
            resource: "cluster-groups"
            partitionNumber: "{{ .Values.partitionNumber }}"

  template:
    metadata:
      name: 'cluster-partition-{{ .Values.partitionNumber }}-{{ "{{ .controlPlane }}" }}'

    spec:
      project: default

      source:
        repoURL: {{ .Values.repoURL }}
        targetRevision: {{ .Values.targetRevision }}
        path: charts/cluster-registration
        helm:
          valuesObject:
            partitionNumber: {{ .Values.partitionNumber }}
            controlPlane: '{{ "{{ .controlPlane }}" }}'
            clusters: '{{ "{{ .clusters | toJson }}" }}'

      destination:
        name: '{{ "{{ .controlPlane }}" }}'
        namespace: argocd

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
