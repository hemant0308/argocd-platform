{{- /*
  Two-layer template escaping
  ───────────────────────────
  Helm processes this file first.  To pass ArgoCD goTemplate tokens through
  unchanged, wrap them in Helm string literals:

    {{ "{{ .controlPlane }}" }}   →  Helm emits  →  {{ .controlPlane }}

  ArgoCD then evaluates the literal using goTemplate (spec.goTemplate: true).

  goTemplate is required because the clusters field is a native JSON array
  from the plugin.  With goTemplate, {{ .clusters | toJson }} serialises it
  to a proper JSON string that Helm receives as .Values.clusters.
  The downstream chart (cluster-registration) parses it back with
  fromJsonArray (Helm built-in that correctly handles JSON arrays, unlike
  fromJson / fromYaml which both unmarshal into map[string]interface{}).
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Named cluster-groups-{N}-{cpName} (not cluster-partition-…) to avoid a
  # 3-level naming collision:
  #   Layer 2 Application   : cluster-partition-{N}-{CP}  (created by argocd/managed AppSet)
  #   Layer 3 ApplicationSet: cluster-groups-{N}-{CP}     ← this resource
  #   Layer 4 Application   : cluster-group-{N}-{CP}      (created below)
  # Under Option B controlPlane == cpName, so using "cluster-partition" at every
  # level would produce three identically-named resources — a hard K8s conflict
  # for the two Application kinds at layers 2 and 4.
  name: cluster-groups-{{ .Values.partitionNumber }}-{{ .Values.cpName }}
  namespace: argocd
  annotations:
    argocd-platform/partition-number: "{{ .Values.partitionNumber }}"
    argocd-platform/cp-name: "{{ .Values.cpName }}"
    argocd-platform/generation: "{{ .Values.generation }}"

spec:
  goTemplate: true

  generators:
    - plugin:
        requeueAfterSeconds: {{ .Values.requeueAfterSeconds }}
        configMapRef:
          name: argocd-platform-plugin
        input:
          parameters:
            resource: "cluster-groups"
            partitionNumber: "{{ .Values.partitionNumber }}"
            # Required by Option B: the plugin looks up the partition by (partitionNumber, cpName).
            cpName: "{{ .Values.cpName }}"

  template:
    metadata:
      # cluster-group-{N}-{controlPlane}: leaf Application that deploys cluster-registration.
      # Distinct from the Layer 2 "cluster-partition-{N}-{CP}" Application above it.
      name: 'cluster-group-{{ .Values.partitionNumber }}-{{ "{{ .controlPlane }}" }}'
      labels:
        argocd-platform/resource-type: cluster
        argocd-platform/partition-number: "{{ .Values.partitionNumber }}"
        argocd-platform/control-plane: '{{ "{{ .controlPlane }}" }}'
      annotations:
        notifications.argoproj.io/subscribe.on-cluster-partition-synced.platform-status: ""
        notifications.argoproj.io/subscribe.on-cluster-partition-failed.platform-status: ""

    spec:
      project: default

      source:
        repoURL: {{ .Values.repoURL }}
        targetRevision: {{ .Values.targetRevision }}
        path: charts/cluster-registration
        helm:
          valuesObject:
            partitionNumber: {{ .Values.partitionNumber }}
            controlPlane: '{{ "{{ .controlPlane }}" }}'
            clusters: '{{ "{{ .clusters | toJson }}" }}'

      destination:
        name: '{{ "{{ .controlPlane }}" }}'
        namespace: argocd

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
