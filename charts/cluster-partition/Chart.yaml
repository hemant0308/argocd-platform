apiVersion: v2
name: cluster-partition
description: >
  Creates a cluster-groups ApplicationSet for a single cluster partition.
  Deployed by the outer cluster-partition-{N} Application (generated by the
  cluster-partitions ApplicationSet). The inner ApplicationSet uses goTemplate
  mode to query the plugin generator (resource=cluster-groups) for clusters
  grouped by control plane, then creates one cluster-registration Application
  per control plane.
type: application
version: 1.0.0
