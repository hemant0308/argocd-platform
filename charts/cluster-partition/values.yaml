# Partition number — identifies which cluster partition this chart manages.
# Injected from the outer cluster-partitions ApplicationSet via valuesObject.
partitionNumber: ""

# Control plane name that owns this partition (CP-scoped, Option B).
# Injected from the outer cluster-partitions ApplicationSet via valuesObject.
# Forwarded to the cluster-groups plugin so it can look up the partition by
# (partitionNumber, cpName). Also used to uniquify this ApplicationSet's name
# so that two CPs with the same partitionNumber don't collide.
cpName: ""

# Generation — bumped in the DB whenever clusters are added to or removed
# from this partition. Embedding it as an annotation on the inner ApplicationSet
# causes ArgoCD to re-sync this chart and re-evaluate the plugin generator.
generation: ""

# Source repository where charts/cluster-registration lives.
# Must match the repoURL used by the outer bootstrap application.
repoURL: https://github.com/hemant0308/argocd-platform.git
targetRevision: main

# Poll interval (seconds) for the cluster-groups plugin generator.
# Injected from argocd/managed via the parent ApplicationSet valuesObject.
# Override requeueAfterSeconds.clusterGroups in argocd/managed/values.yaml
# to tune for all partitions at once.
requeueAfterSeconds: 30
