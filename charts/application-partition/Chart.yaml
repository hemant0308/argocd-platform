apiVersion: v2
name: application-partition
description: >
  Creates an application-groups ApplicationSet for a single application partition.
  Deployed by the outer application-partition-{N} Application (generated by the
  application-partitions ApplicationSet). The inner ApplicationSet uses goTemplate
  mode to query the plugin generator (resource=application-groups) for applications
  grouped by control plane, then creates one argocd-application Application per
  control plane. Applications without a control plane assignment are excluded.
type: application
version: 1.0.0
