{{- /*
  Two-layer template escaping
  ───────────────────────────
  Helm processes this file first.  To pass ArgoCD goTemplate tokens through
  unchanged, wrap them in Helm string literals:

    {{ "{{ .controlPlane }}" }}   →  Helm emits  →  {{ .controlPlane }}

  ArgoCD then evaluates the literal using goTemplate (spec.goTemplate: true).

  goTemplate is required because the applications field is a native JSON array
  from the plugin.  With goTemplate, {{ .applications | toJson }} serialises it
  to a proper JSON string that Helm receives as .Values.applications.
  The downstream chart (application-registration) parses it back with
  fromJsonArray (Helm built-in that correctly handles JSON arrays, unlike
  fromJson / fromYaml which both unmarshal into map[string]interface{}).

  Each application entry carries a nested sources array.  fromJsonArray on
  the outer list gives a Go slice; .sources within each element is
  automatically a []interface{} that range can iterate in the leaf chart.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Named application-groups-{N} (Option A: globally unique partition numbers).
  # The plugin returns one entry per CP for this partition (CP fan-out),
  # so the inner template name uses {{ .controlPlane }} from the plugin response
  # to produce distinct leaf Applications per CP.
  name: application-groups-{{ .Values.partitionNumber }}
  namespace: argocd
  annotations:
    argocd-platform/partition-number: "{{ .Values.partitionNumber }}"
    argocd-platform/generation: "{{ .Values.generation }}"

spec:
  goTemplate: true

  generators:
    - plugin:
        requeueAfterSeconds: {{ .Values.requeueAfterSeconds }}
        configMapRef:
          name: argocd-platform-plugin
        input:
          parameters:
            resource: "application-groups"
            partitionNumber: "{{ .Values.partitionNumber }}"
            # generation is included in the spec (not just metadata.annotations) so that when
            # the partition generation changes, this ApplicationSet's spec changes → ArgoCD
            # increments metadata.generation → controller reconciles immediately rather than
            # waiting the requeueAfterSeconds safety-net poll (600 s).
            # The plugin endpoint ignores this field (Map<String,String> — extra keys are safe).
            generation: "{{ .Values.generation }}"

  template:
    metadata:
      # application-group-{N}-{controlPlane}: leaf Application that deploys application-registration.
      # controlPlane comes from the plugin CP fan-out response (one entry per CP).
      name: 'application-group-{{ .Values.partitionNumber }}-{{ "{{ .controlPlane }}" }}'
      labels:
        # resource-type drives switch-case routing in ArgoCDStatusService.
        argocd-platform/resource-type: application-partition
        # partition-number and control-plane are required @NotBlank fields in ArgoCDStatusRequest.
        argocd-platform/partition-number: "{{ .Values.partitionNumber }}"
        argocd-platform/control-plane: '{{ "{{ .controlPlane }}" }}'
        # generation carries the partition version counter so the status service can
        # confirm — without a fixed delay — that the finalizer-bearing manifest was
        # included in this sync before advancing HARD_DELETE → AWAITING_PRUNE.
        argocd-platform/generation: '{{ "{{ .generation }}" }}'
      annotations:
        # Subscribe this Application to on-application-partition-synced so the managed
        # ArgoCD fires a webhook to /internal/argocd/status on every successful sync.
        notifications.argoproj.io/subscribe.on-application-partition-synced.platform-status: ""

    spec:
      project: default

      source:
        repoURL: {{ .Values.repoURL }}
        targetRevision: {{ .Values.targetRevision }}
        path: charts/application-registration
        helm:
          valuesObject:
            partitionNumber: {{ .Values.partitionNumber }}
            controlPlane: '{{ "{{ .controlPlane }}" }}'
            applications: '{{ "{{ .applications | toJson }}" }}'

      destination:
        name: '{{ "{{ .controlPlane }}" }}'
        namespace: argocd

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
