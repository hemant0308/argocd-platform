partitionNumber: ""

# Control plane name that owns this partition (CP-scoped, Option B).
# Injected from the outer application-partitions ApplicationSet via valuesObject.
# Forwarded to the application-groups plugin so it can look up the partition by
# (partitionNumber, cpName). Also used to uniquify this ApplicationSet's name
# so that two CPs with the same partitionNumber don't collide.
cpName: ""

generation: ""
repoURL: https://github.com/hemant0308/argocd-platform.git
targetRevision: main

# Poll interval (seconds) for the application-groups plugin generator.
# Injected from argocd/managed via the parent ApplicationSet valuesObject.
# Override requeueAfterSeconds.applicationGroups in argocd/managed/values.yaml
# to tune for all partitions at once.
requeueAfterSeconds: 30
