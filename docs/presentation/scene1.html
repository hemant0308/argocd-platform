<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scalable Managed ArgoCD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#080B12; overflow:hidden; width:100vw; height:100vh; font-family:'Inter',-apple-system,sans-serif; cursor:pointer; user-select:none; }
    canvas { display:block; position:absolute; top:0; left:0; pointer-events:none; }
    #progress {
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      display:flex; gap:7px; align-items:center; pointer-events:none;
    }
    .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.4s ease; }
    .dot.active { background:rgba(255,255,255,0.75); width:18px; border-radius:3px; }
    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.18); font-size:11px; letter-spacing:0.10em;
      text-transform:uppercase; pointer-events:none; white-space:nowrap; transition:opacity 0.5s;
    }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click or press Space to continue</div>
<div id="progress"></div>

<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}
resize(); window.addEventListener('resize', resize);

// ── ArgoCD icon ───────────────────────────────────────────────────────────────
const _argoImg = new Image(); let _argoOC = null;
_argoImg.onload = () => {
  const oc = document.createElement('canvas'); oc.width = 128; oc.height = 128;
  oc.getContext('2d').drawImage(_argoImg, 0, 0, 128, 128); _argoOC = oc;
};
_argoImg.src = 'argocd-icon.svg';

// ── Ambient star field ────────────────────────────────────────────────────────
const STARS = Array.from({ length: 120 }, () => ({
  x:  Math.random(),
  y:  Math.random(),
  r:  0.5 + Math.random() * 1.1,
  vx: (Math.random() - 0.5) * 0.00005,
  vy: (Math.random() - 0.5) * 0.00005,
  op: 0.04 + Math.random() * 0.14,
  col: Math.random() < 0.55 ? '#60A5FA' : '#A78BFA',
}));

// ── Animation scalars ─────────────────────────────────────────────────────────
const A = { icon: 0, title: 0, tagline: 0 };
let step = 0, MAX_STEPS = 3, pulse = 0;

function tickAnim() {
  const sp = 0.030;
  A.icon    += ((step >= 0 ? 1 : 0) - A.icon)    * sp * 1.3;
  A.title   += ((step >= 1 ? 1 : 0) - A.title)   * sp;
  A.tagline += ((step >= 2 ? 1 : 0) - A.tagline) * sp;
}

// ── Ring pulse ────────────────────────────────────────────────────────────────
const RING_PHASES = [0, 0.33, 0.67];

function drawRings(cx, cy, op) {
  RING_PHASES.forEach(ph => {
    const t = ((pulse * 0.32 + ph) % 1);
    const r = 52 + t * 92;
    const a = (1 - t) * 0.28 * op;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#3B82F6';
    ctx.lineWidth   = 1.4;
    ctx.shadowColor = '#3B82F6'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  });
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function drawBg() {
  ctx.fillStyle = '#080B12'; ctx.fillRect(0, 0, W, H);
  // star field
  STARS.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    if (s.x < 0) s.x = 1; if (s.x > 1) s.x = 0;
    if (s.y < 0) s.y = 1; if (s.y > 1) s.y = 0;
    ctx.save(); ctx.globalAlpha = s.op; ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill(); ctx.restore();
  });
}

function drawScene() {
  const cx = W / 2;
  const iconCY = H * 0.40;
  const iconOp = A.icon;

  if (iconOp > 0.01) {
    // Radial glow halo
    const grad = ctx.createRadialGradient(cx, iconCY, 0, cx, iconCY, 140);
    grad.addColorStop(0, `rgba(59,130,246,${iconOp * 0.14})`);
    grad.addColorStop(0.5, `rgba(59,130,246,${iconOp * 0.04})`);
    grad.addColorStop(1, 'transparent');
    ctx.save(); ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, iconCY, 140, 0, Math.PI * 2);
    ctx.fill(); ctx.restore();

    // Expanding rings
    drawRings(cx, iconCY, iconOp);

    // Icon
    if (_argoOC) {
      const sz = Math.min(96, H * 0.10);
      ctx.save();
      ctx.globalAlpha = iconOp;
      ctx.shadowColor = 'rgba(59,130,246,0.65)';
      ctx.shadowBlur  = 22 + Math.sin(pulse * 0.7) * 8;
      ctx.drawImage(_argoOC, cx - sz / 2, iconCY - sz / 2, sz, sz);
      ctx.restore();
    }
  }

  // Title
  if (A.title > 0.01) {
    const fs = Math.min(54, Math.max(28, W * 0.034));
    ctx.save();
    ctx.globalAlpha = A.title;
    ctx.font = `700 ${fs}px Inter,sans-serif`;
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,255,255,0.10)'; ctx.shadowBlur = 18;
    ctx.fillText('Scalable Managed ArgoCD', cx, H * 0.57);
    ctx.restore();
  }

  // Tagline
  if (A.tagline > 0.01) {
    const ts = Math.min(21, Math.max(13, W * 0.013));
    ctx.save();
    ctx.globalAlpha = A.tagline * 0.58;
    ctx.font = `500 ${ts}px Inter,sans-serif`;
    ctx.fillStyle = '#93C5FD';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GitOps built for scale', cx, H * 0.64);
    ctx.restore();
  }
}

// ── Progress dots ─────────────────────────────────────────────────────────────
const progressEl = document.getElementById('progress');
const hintEl     = document.getElementById('hint');
for (let i = 0; i < MAX_STEPS; i++) {
  const d = document.createElement('div'); d.className = 'dot'; d.id = 'dot' + i;
  progressEl.appendChild(d);
}
function updateUI() {
  for (let i = 0; i < MAX_STEPS; i++)
    document.getElementById('dot' + i).className = 'dot' + (i === step ? ' active' : '');
}

let hintTimer;
function advance() {
  if (step >= MAX_STEPS - 1) { window.parent.postMessage({ type: 'scene-complete' }, '*'); return; }
  step++;
  updateUI();
  hintEl.classList.remove('hidden');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 3000);
}

document.addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); advance(); return; }
  if (e.code === 'ArrowLeft' && step === 0) { window.parent.postMessage({ type: 'scene-back' }, '*'); return; }
  if (e.code === 'ArrowLeft' && step > 0) { step--; updateUI(); }
});

function loop() {
  requestAnimationFrame(loop);
  pulse += 0.022;
  tickAnim();
  drawBg();
  drawScene();
}
updateUI();
setTimeout(() => hintEl.classList.add('hidden'), 4500);
loop();

// ── ArrowUp = prev scene, ArrowDown = next scene ─────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowUp')   { e.preventDefault(); window.parent.postMessage({type:'scene-back'},'*'); }
  if (e.code === 'ArrowDown') { e.preventDefault(); window.parent.postMessage({type:'scene-complete'},'*'); }
}, true);
</script>
</body>
</html>
