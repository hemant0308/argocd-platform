<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 8 — The Self-Assembling Hierarchy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#080B12; overflow:hidden;
      width:100vw; height:100vh;
      font-family:'Inter',-apple-system,sans-serif;
      cursor:pointer; user-select:none;
    }
    canvas { display:block; position:absolute; top:0; left:0; pointer-events:none; }
    #narrative {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      pointer-events:none; opacity:0; transition:opacity 1.2s ease;
    }
    #narrative.visible { opacity:1; }
    #nar-title {
      color:#fff; font-size:clamp(20px,2.8vw,46px);
      font-weight:700; letter-spacing:-0.025em;
      text-align:center; line-height:1.2; max-width:820px; padding:0 40px;
    }
    #nar-sub {
      margin-top:14px; color:rgba(255,255,255,0.42);
      font-size:clamp(13px,1.5vw,20px); text-align:center; padding:0 40px;
    }
    #scene-label {
      position:absolute; top:28px; left:36px;
      color:rgba(255,255,255,0.18); font-size:11px;
      letter-spacing:0.12em; text-transform:uppercase; font-weight:500; pointer-events:none;
    }
    #step-label {
      position:absolute; top:28px; right:36px;
      color:rgba(255,255,255,0.30); font-size:11.5px; letter-spacing:0.03em;
      font-weight:500; pointer-events:none; text-align:right; max-width:540px;
    }
    #progress {
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      display:flex; gap:7px; align-items:center; pointer-events:none;
    }
    .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.4s ease; }
    .dot.active { background:rgba(255,255,255,0.75); width:18px; border-radius:3px; }
    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.18); font-size:11px; letter-spacing:0.10em;
      text-transform:uppercase; pointer-events:none; white-space:nowrap; transition:opacity 0.5s;
    }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="narrative"><h1 id="nar-title"></h1><p id="nar-sub"></p></div>
<div id="scene-label">Scene 12 &nbsp;/&nbsp; The Self-Assembling Hierarchy</div>
<div id="step-label"></div>
<div id="hint">Click or press Space to continue</div>
<div id="progress"></div>

<script>
'use strict';

// ─── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize', resize);

// ─── ArgoCD icon ──────────────────────────────────────────────────────────────
const _argoImg = new Image();
let _argoOC = null;
_argoImg.onload = () => {
  const oc = document.createElement('canvas');
  oc.width = 64; oc.height = 64;
  oc.getContext('2d').drawImage(_argoImg, 0, 0, 64, 64);
  _argoOC = oc;
};
_argoImg.src = 'argocd-icon.svg';

function drawArgoLabel(cx, cy, text, font, color, op, iconSz) {
  if (iconSz === undefined) iconSz = 14;
  ctx.save();
  ctx.font = font;
  const tw = ctx.measureText(text).width;
  const gap = 5, totalW = iconSz + gap + tw;
  const ix = cx - totalW / 2;
  ctx.globalAlpha = op; ctx.shadowBlur = 0;
  if (_argoOC) ctx.drawImage(_argoOC, ix, cy - iconSz / 2, iconSz, iconSz);
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, ix + iconSz + gap, cy);
  ctx.restore();
}

// ─── Managed ArgoCD box ────────────────────────────────────────────────────────
const BOX = { x1:0.07, y1:0.14, x2:0.93, y2:0.79 };

// ─── Nodes ────────────────────────────────────────────────────────────────────
const NODES = {
  // Outside box — top
  platform: { rx:0.50, ry:0.07, type:'platform', step:0 },

  // Inside box — L1
  l1_appset: { rx:0.50, ry:0.225, type:'l1_appset', step:2 },

  // Inside box — L2 (Applications, one per partition)
  l2_p1: { rx:0.30, ry:0.355, type:'l2_app',
    label:'App-P1', sublabel:'Partition-1',
    color:'#60A5FA', glow:'rgba(96,165,250,0.38)', border:'rgba(96,165,250,0.65)', bg:'rgba(4,10,26,0.97)',
    lvl:'L2', step:3 },
  l2_p2: { rx:0.70, ry:0.355, type:'l2_app',
    label:'App-P2', sublabel:'Partition-2',
    color:'#60A5FA', glow:'rgba(96,165,250,0.38)', border:'rgba(96,165,250,0.65)', bg:'rgba(4,10,26,0.97)',
    lvl:'L2', step:3 },

  // Inside box — L3 (ApplicationSets, one per partition)
  l3_p1: { rx:0.30, ry:0.495, type:'l3_appset',
    label:'AppSet-P1', sublabel:'polls partition',
    color:'#A78BFA', glow:'rgba(167,139,250,0.38)', border:'rgba(139,92,246,0.65)', bg:'rgba(12,8,30,0.97)',
    lvl:'L3', step:4 },
  l3_p2: { rx:0.70, ry:0.495, type:'l3_appset',
    label:'AppSet-P2', sublabel:'polls partition',
    color:'#A78BFA', glow:'rgba(167,139,250,0.38)', border:'rgba(139,92,246,0.65)', bg:'rgba(12,8,30,0.97)',
    lvl:'L3', step:4 },

  // Inside box — L4 (Applications, one per CP per partition)
  l4_p1_cp1: { rx:0.18, ry:0.645, type:'l4_app',
    label:'P1 · CP-1', color:'#FCD34D', glow:'rgba(252,211,77,0.32)', border:'rgba(252,211,77,0.55)', bg:'rgba(18,14,4,0.97)',
    lvl:'L4', step:6 },
  l4_p1_cp2: { rx:0.42, ry:0.645, type:'l4_app',
    label:'P1 · CP-2', color:'#FCD34D', glow:'rgba(252,211,77,0.32)', border:'rgba(252,211,77,0.55)', bg:'rgba(18,14,4,0.97)',
    lvl:'L4', step:6 },
  l4_p2_cp1: { rx:0.58, ry:0.645, type:'l4_app',
    label:'P2 · CP-1', color:'#FCD34D', glow:'rgba(252,211,77,0.32)', border:'rgba(252,211,77,0.55)', bg:'rgba(18,14,4,0.97)',
    lvl:'L4', step:6 },
  l4_p2_cp2: { rx:0.82, ry:0.645, type:'l4_app',
    label:'P2 · CP-2', color:'#FCD34D', glow:'rgba(252,211,77,0.32)', border:'rgba(252,211,77,0.55)', bg:'rgba(18,14,4,0.97)',
    lvl:'L4', step:6 },

  // Outside box — CPs (below)
  cp1: { rx:0.28, ry:0.905, type:'cp', label:'CP-1', step:0 },
  cp2: { rx:0.72, ry:0.905, type:'cp', label:'CP-2', step:0 },
};
const opacity = {};
Object.keys(NODES).forEach(k => opacity[k] = 0);

// ─── Particle connections (active at given step) ───────────────────────────────
const CONNS = [
  // L1 ↔ Platform (partition list poll, step 2)
  { from:'l1_appset', to:'platform',   step:2, col:'#60A5FA' },
  { from:'platform',  to:'l1_appset',  step:2, col:'#4ADE80' },
  // L3-P1 ↔ Platform (partition content poll, step 5)
  { from:'l3_p1',     to:'platform',   step:5, col:'#A78BFA' },
  { from:'platform',  to:'l3_p1',      step:5, col:'#C4B5FD' },
  // L3-P2 ↔ Platform (partition content poll, step 5)
  { from:'l3_p2',     to:'platform',   step:5, col:'#8B5CF6' },
  { from:'platform',  to:'l3_p2',      step:5, col:'#DDD6FE' },
  // L4 → CP registration particles (step 7)
  { from:'l4_p1_cp1', to:'cp1',        step:7, col:'#FCD34D' },
  { from:'l4_p1_cp2', to:'cp2',        step:7, col:'#FCD34D' },
  { from:'l4_p2_cp1', to:'cp1',        step:7, col:'#FB923C' },
  { from:'l4_p2_cp2', to:'cp2',        step:7, col:'#FB923C' },
];

// ─── Static structural lines (visual hierarchy, no particles) ──────────────────
const SLINES = [
  // L1 → L2
  { from:'l1_appset', to:'l2_p1', step:3, tag:null },
  { from:'l1_appset', to:'l2_p2', step:3, tag:null },
  // L2 → L3 (partition helm chart)
  { from:'l2_p1', to:'l3_p1', step:4, tag:'helm' },
  { from:'l2_p2', to:'l3_p2', step:4, tag:'helm' },
  // L3 → L4
  { from:'l3_p1', to:'l4_p1_cp1', step:6, tag:null },
  { from:'l3_p1', to:'l4_p1_cp2', step:6, tag:null },
  { from:'l3_p2', to:'l4_p2_cp1', step:6, tag:null },
  { from:'l3_p2', to:'l4_p2_cp2', step:6, tag:null },
  // L4 → CP (registration helm chart — static skeleton; particles added via CONNS)
  { from:'l4_p1_cp1', to:'cp1', step:7, tag:'helm' },
  { from:'l4_p1_cp2', to:'cp2', step:7, tag:'helm' },
  { from:'l4_p2_cp1', to:'cp1', step:7, tag:'helm' },
  { from:'l4_p2_cp2', to:'cp2', step:7, tag:'helm' },
];

// ─── State ────────────────────────────────────────────────────────────────────
let step     = 0;
const MAX_STEPS = 10; // steps 0–9
let particles = [];
let frozen    = false;
let t = 0, pulse = 0;

// Partition assignment animation (steps 0-1)
let p1Fill  = 8.0;   // current fill level of Partition-1 (out of 10)
let p2Fill  = 0.0;   // current fill level of Partition-2
let panelOp = 1.0;   // partition panel opacity (fades at step 2)

// ─── Particle class ───────────────────────────────────────────────────────────
class Particle {
  constructor(from, to, col) {
    this.from = from; this.to = to; this.col = col;
    this.p   = 0;
    this.spd = 0.007 + Math.random() * 0.004;
    this.r   = 1.8 + Math.random() * 1.2;
    this.bow = { x:(Math.random()-.5)*0.04, y:(Math.random()-.5)*0.03 };
    this.alive = true;
  }
  pos() {
    const f=NODES[this.from], t2=NODES[this.to];
    const fx=f.rx*W, fy=f.ry*H, tx=t2.rx*W, ty=t2.ry*H;
    const cx=(fx+tx)/2+this.bow.x*Math.min(W,H);
    const cy=(fy+ty)/2+this.bow.y*Math.min(W,H);
    const u=1-this.p;
    return { x:u*u*fx+2*u*this.p*cx+this.p*this.p*tx,
             y:u*u*fy+2*u*this.p*cy+this.p*this.p*ty };
  }
  update() { this.p+=this.spd; if(this.p>=1) this.alive=false; }
  draw() {
    const {x,y}=this.pos(), a=Math.sin(this.p*Math.PI);
    ctx.save();
    ctx.globalAlpha=a*0.35; ctx.fillStyle=this.col; ctx.shadowColor=this.col; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(x,y,this.r*2.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=a*0.90; ctx.shadowBlur=4;
    ctx.beginPath(); ctx.arc(x,y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function maybeSpawn() {
  if (frozen || step >= 9) return;
  CONNS.forEach(c => {
    if (c.step > step) return;
    const fo=opacity[c.from]||0, to2=opacity[c.to]||0;
    if (fo < 0.3 || to2 < 0.3) return;
    const rate = (step >= 8) ? 0.030 : 0.016;
    if (Math.random() < rate) particles.push(new Particle(c.from, c.to, c.col));
  });
}

// ─── Opacity management ───────────────────────────────────────────────────────
function opTarget(key) {
  if (step >= 9) return 0.12;
  const n = NODES[key];
  if (n.step > step) return 0;
  // CPs dim until registration step
  if ((key==='cp1'||key==='cp2') && step < 7) return 0.30;
  // Platform dim at steps 0-1 (partition assignment phase)
  if (key==='platform' && step < 2) return 0.40;
  return 1;
}
function updateOpacity() {
  Object.keys(NODES).forEach(k => { opacity[k]+=(opTarget(k)-opacity[k])*0.028; });
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function rr(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ─── Background ───────────────────────────────────────────────────────────────
function drawBg() {
  ctx.fillStyle='#080B12'; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.min(W,H)*.55);
  g.addColorStop(0,'rgba(5,18,45,0.10)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

// ─── Managed ArgoCD box ───────────────────────────────────────────────────────
function drawManagedArgoBox() {
  const bx=BOX.x1*W, by=BOX.y1*H;
  const bw=(BOX.x2-BOX.x1)*W, bh=(BOX.y2-BOX.y1)*H;
  const hdrH=34;
  const boxOp = Math.max(opacity.l1_appset, opacity.l2_p1);
  if (boxOp < 0.01) return;
  ctx.save();
  ctx.globalAlpha=boxOp*0.026; ctx.fillStyle='#3B82F6'; rr(bx,by,bw,bh,18); ctx.fill();
  ctx.globalAlpha=boxOp*0.10; ctx.fillStyle='#1D4ED8';
  ctx.beginPath();
  ctx.moveTo(bx+18,by); ctx.lineTo(bx+bw-18,by);
  ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+18);
  ctx.lineTo(bx+bw,by+hdrH); ctx.lineTo(bx,by+hdrH);
  ctx.lineTo(bx,by+18); ctx.quadraticCurveTo(bx,by,bx+18,by);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=boxOp*0.30; ctx.strokeStyle='rgba(96,165,250,0.55)'; ctx.lineWidth=1.5;
  ctx.setLineDash([8,14]); rr(bx,by,bw,bh,18); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  drawArgoLabel(bx+bw/2, by+hdrH/2, 'Managed ArgoCD', '700 14px Inter,sans-serif', '#93C5FD', boxOp*0.80, 15);
}

// ─── Partition assignment panel (steps 0-1) ───────────────────────────────────
function drawPartitionRow(bx, y, label, fill, color, op) {
  const barW=220, barH=16, r=5;
  ctx.save(); ctx.globalAlpha=op;
  ctx.fillStyle='rgba(200,220,255,0.50)'; ctx.font='500 11px Inter,sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText(label, bx-8, y);
  // track
  ctx.globalAlpha=op*0.28; ctx.fillStyle='#1E293B';
  rr(bx, y-barH/2, barW, barH, r); ctx.fill();
  // fill
  if (fill > 0) {
    ctx.globalAlpha=op;
    ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=5;
    rr(bx, y-barH/2, Math.max(barH, (fill/10)*barW), barH, r); ctx.fill();
    ctx.shadowBlur=0;
  }
  // count / status
  const isFull = fill >= 9.95;
  ctx.globalAlpha=op;
  ctx.fillStyle=isFull ? '#FCA5A5' : `${color}CC`;
  ctx.font=isFull ? '700 11px Inter,sans-serif' : '500 11px Inter,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(isFull ? 'FULL' : `${Math.floor(fill)} / 10`, bx+barW+8, y);
  ctx.restore();
}

function drawPartitionPanel() {
  if (panelOp < 0.01) return;
  const op = panelOp;
  const cx = W*0.50;
  const panelW = 400;
  const panelH = step >= 1 ? 148 : 96;
  const py = H*0.43;
  const bx = cx - 100; // bar start x

  ctx.save();
  ctx.globalAlpha=op*0.92;
  ctx.fillStyle='rgba(8,11,18,0.96)'; ctx.strokeStyle='rgba(100,116,139,0.35)'; ctx.lineWidth=1;
  rr(cx-panelW/2, py-panelH/2, panelW, panelH, 14); ctx.fill(); ctx.stroke();
  // Title
  ctx.globalAlpha=op;
  ctx.fillStyle='rgba(148,163,184,0.55)'; ctx.font='500 10px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('RESOURCE ONBOARDING', cx, py-panelH/2+18);
  ctx.restore();

  // Partition-1 bar
  const p1y = step >= 1 ? py - panelH/2 + 56 : py - panelH/2 + 52;
  drawPartitionRow(bx, p1y, 'Partition-1', p1Fill, '#2DD4BF', op);

  // Partition-2 bar (step 1+)
  if (step >= 1) {
    const p2y = py - panelH/2 + 106;
    drawPartitionRow(bx, p2y, 'Partition-2', p2Fill, '#A78BFA', op);
    if (p2Fill > 0.05) {
      ctx.save(); ctx.globalAlpha=op;
      ctx.fillStyle='#86EFAC'; ctx.font='700 10px Inter,sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText('← created', bx+220+55, p2y);
      ctx.restore();
    }
  }
}

// ─── Static structural lines ──────────────────────────────────────────────────
function drawStaticLines() {
  SLINES.forEach(sl => {
    if (sl.step > step) return;
    const f=NODES[sl.from], t2=NODES[sl.to];
    const fo=opacity[sl.from]||0, to2=opacity[sl.to]||0;
    const lo=Math.min(fo,to2); if(lo<0.04) return;
    const x1=f.rx*W, y1=f.ry*H, x2=t2.rx*W, y2=t2.ry*H;
    ctx.save();
    ctx.globalAlpha=lo*0.28; ctx.strokeStyle='rgba(148,163,184,0.55)';
    ctx.lineWidth=1; ctx.setLineDash([4,9]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    // Helm badge at midpoint
    if (sl.tag === 'helm') {
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      ctx.globalAlpha=lo*0.85;
      ctx.fillStyle='rgba(12,18,38,0.96)'; ctx.strokeStyle='rgba(148,163,184,0.45)'; ctx.lineWidth=1;
      rr(mx-17, my-9, 34, 18, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(125,211,252,0.90)'; ctx.font='600 9px Inter,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⎈ helm', mx, my);
    }
    ctx.restore();
  });
}

// ─── Particle connection skeleton lines ───────────────────────────────────────
function drawLines() {
  const drawn = new Set();
  CONNS.forEach(c => {
    if (c.step > step) return;
    const key=[c.from,c.to].sort().join('|');
    if (drawn.has(key)) return; drawn.add(key);
    const fo=opacity[c.from]||0, to2=opacity[c.to]||0;
    const lo=Math.min(fo,to2); if(lo<0.04) return;
    ctx.save();
    ctx.globalAlpha=lo*0.16; ctx.strokeStyle='rgba(120,160,220,0.5)';
    ctx.lineWidth=1; ctx.setLineDash([4,10]); ctx.lineDashOffset=-(t*0.22);
    ctx.beginPath();
    ctx.moveTo(NODES[c.from].rx*W, NODES[c.from].ry*H);
    ctx.lineTo(NODES[c.to].rx*W,   NODES[c.to].ry*H);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  });
}

// ─── Node draw functions ──────────────────────────────────────────────────────
function drawPlatform(x, y, op) {
  const [w,h]=[172,58], px=x-w/2, py=y-h/2;
  const bl=8+Math.sin(pulse*0.7)*4;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(74,222,128,0.42)'; ctx.shadowBlur=bl;
  ctx.fillStyle='rgba(4,18,12,0.97)'; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(74,222,128,0.68)'; ctx.lineWidth=1.5;
  rr(px,py,w,h,10); ctx.stroke();
  ctx.fillStyle='rgba(74,222,128,0.50)'; ctx.font='500 10px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Spring Boot · API Server', x, y+8);
  ctx.restore();
  drawArgoLabel(x, y-7, 'Platform Service', '600 13px Inter,sans-serif', '#4ADE80', op, 13);
}

function levelBadge(px, py, lvl, color) {
  ctx.fillStyle = `${color}28`;
  rr(px+5, py+5, 24, 15, 3); ctx.fill();
  ctx.fillStyle = `${color}BB`; ctx.font = '700 8px Inter,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(lvl, px+17, py+12.5);
}

function drawL1AppSet(x, y, op) {
  const [w,h]=[178,56], px=x-w/2, py=y-h/2;
  const bl=14+Math.sin(pulse*0.6)*5;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(74,222,128,0.44)'; ctx.shadowBlur=bl;
  ctx.fillStyle='rgba(4,14,8,0.97)'; rr(px,py,w,h,12); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(74,222,128,0.68)'; ctx.lineWidth=1.5;
  rr(px,py,w,h,12); ctx.stroke();
  levelBadge(px, py, 'L1', '#4ADE80');
  ctx.fillStyle='rgba(74,222,128,0.50)'; ctx.font='500 10px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('polls partition list', x, y+9);
  ctx.restore();
  drawArgoLabel(x, y-8, 'ApplicationSet', '700 13px Inter,sans-serif', '#4ADE80', op, 13);
}

function drawL2App(x, y, op, n) {
  const [w,h]=[148,48], px=x-w/2, py=y-h/2;
  const bl=10+Math.sin(pulse*0.7)*3;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=n.glow; ctx.shadowBlur=bl;
  ctx.fillStyle=n.bg; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=n.border; ctx.lineWidth=1.5;
  rr(px,py,w,h,10); ctx.stroke();
  levelBadge(px, py, n.lvl, n.color);
  ctx.fillStyle=n.color; ctx.font='600 12px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(n.label, x, y-6);
  ctx.fillStyle=`${n.color}60`; ctx.font='500 10px Inter,sans-serif';
  ctx.fillText(n.sublabel, x, y+7);
  ctx.restore();
}

function drawL3AppSet(x, y, op, n) {
  const [w,h]=[154,50], px=x-w/2, py=y-h/2;
  const bl=12+Math.sin(pulse*0.75)*4;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=n.glow; ctx.shadowBlur=bl;
  ctx.fillStyle=n.bg; rr(px,py,w,h,12); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=n.border; ctx.lineWidth=1.5;
  rr(px,py,w,h,12); ctx.stroke();
  levelBadge(px, py, n.lvl, n.color);
  ctx.fillStyle=`${n.color}55`; ctx.font='500 9.5px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(n.sublabel, x, y+9);
  ctx.restore();
  drawArgoLabel(x, y-8, n.label, '600 12px Inter,sans-serif', n.color, op, 12);
}

function drawL4App(x, y, op, n) {
  const [w,h]=[112,42], px=x-w/2, py=y-h/2;
  const bl=8+Math.sin(pulse*0.8)*3;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=n.glow; ctx.shadowBlur=bl;
  ctx.fillStyle=n.bg; rr(px,py,w,h,9); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=n.border; ctx.lineWidth=1.5;
  rr(px,py,w,h,9); ctx.stroke();
  levelBadge(px, py, n.lvl, n.color);
  ctx.fillStyle=n.color; ctx.font='600 11px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(n.label, x, y-4);
  ctx.fillStyle=`${n.color}55`; ctx.font='500 9px Inter,sans-serif';
  ctx.fillText('registration', x, y+6);
  ctx.restore();
}

function drawCP(x, y, op, label) {
  const [w,h]=[138,56], px=x-w/2, py=y-h/2;
  const bl=12+Math.sin(pulse*0.65)*4;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(56,189,248,0.45)'; ctx.shadowBlur=bl;
  ctx.fillStyle='rgba(4,14,28,0.97)'; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(56,189,248,0.68)'; ctx.lineWidth=1.5;
  rr(px,py,w,h,10); ctx.stroke();
  ctx.fillStyle='rgba(125,211,252,0.42)'; ctx.font='500 9.5px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Apps · Projects · Clusters', x, y+9);
  ctx.restore();
  drawArgoLabel(x, y-8, label, '700 13px Inter,sans-serif', '#7DD3FC', op, 13);
}

function drawNodes() {
  Object.entries(NODES).forEach(([k,n]) => {
    const op=opacity[k]; if(op<0.005) return;
    const x=n.rx*W, y=n.ry*H;
    switch(n.type) {
      case 'platform':  drawPlatform(x,y,op); break;
      case 'l1_appset': drawL1AppSet(x,y,op); break;
      case 'l2_app':    drawL2App(x,y,op,n); break;
      case 'l3_appset': drawL3AppSet(x,y,op,n); break;
      case 'l4_app':    drawL4App(x,y,op,n); break;
      case 'cp':        drawCP(x,y,op,n.label); break;
    }
  });
}

// ─── Step labels ──────────────────────────────────────────────────────────────
const LABELS = [
  'A new resource is onboarded — assigned to Partition-1',
  'Partition-1 is full — Partition-2 created automatically',
  'L1 ApplicationSet polls Platform Service for the partition list',
  'L1 creates one L2 Application per partition',
  'L2 Applications deploy the partition Helm chart — L3 AppSets emerge',
  'L3 AppSets query Platform Service: resources by control plane',
  'L3 creates one L4 Application per control plane',
  'L4 Applications deploy registration.helm — resources created on clusters',
  'All four levels synchronized — the hierarchy runs itself',
  '',
];
const stepLabelEl = document.getElementById('step-label');
function updateStepLabel() {
  stepLabelEl.textContent = step < 9 ? LABELS[step] : '';
}

// ─── Narrative ────────────────────────────────────────────────────────────────
const narrativeEl = document.getElementById('narrative');
const narTitle    = document.getElementById('nar-title');
const narSub      = document.getElementById('nar-sub');
function updateNarrative() {
  if (step === 9) {
    narTitle.textContent = 'One partition record. Four levels self-assemble.';
    narSub.textContent   = 'ArgoCD manages ArgoCD — fully automated.';
    narrativeEl.classList.add('visible');
  } else {
    narrativeEl.classList.remove('visible');
  }
}

// ─── Progress dots ────────────────────────────────────────────────────────────
const progressEl = document.getElementById('progress');
for (let i=0;i<MAX_STEPS;i++) {
  const d=document.createElement('div');
  d.className='dot'; d.id='dot'+i; progressEl.appendChild(d);
}
function updateDots() {
  for(let i=0;i<MAX_STEPS;i++)
    document.getElementById('dot'+i).className='dot'+(i===step?' active':'');
}

// ─── Step enter ───────────────────────────────────────────────────────────────
function onStepEnter(s) {
  if (s === 9) { frozen=true; particles=[]; }
}

// ─── Advance / keyboard ───────────────────────────────────────────────────────
const hintEl = document.getElementById('hint');
let hintTimer;
function advance() {
  if (step >= MAX_STEPS-1) { window.parent.postMessage({type:'scene-complete'},'*'); return; }
  step++;
  onStepEnter(step);
  updateDots(); updateNarrative(); updateStepLabel();
  hintEl.classList.remove('hidden');
  clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>hintEl.classList.add('hidden'),3000);
}
document.addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if (e.code==='Space'||e.code==='ArrowRight') { e.preventDefault(); advance(); return; }
  // scene-back: ArrowLeft at step 0 signals parent to go to previous scene
  if (e.code==='ArrowLeft'&&step===0) { window.parent.postMessage({type:'scene-back'},'*'); return; }
  if (e.code==='ArrowLeft'&&step>0) {
    step--;
    frozen = false;
    particles = [];
    // Restore partition panel state from step
    panelOp   = step <= 1 ? 1 : panelOp; // keep current fade if already faded
    if (step === 0) { p1Fill = 8;  p2Fill = 0; panelOp = 1; }
    if (step === 1) { p1Fill = 9;  p2Fill = 0; panelOp = 1; }
    if (step >= 2)  { p1Fill = 10; p2Fill = 1; }
    updateDots(); updateNarrative(); updateStepLabel();
  }
});

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  t++; pulse += 0.038;

  // Partition fill animation
  if (step === 0) p1Fill = Math.min(9, p1Fill + 0.007);
  if (step === 1) {
    p1Fill = Math.min(10, p1Fill + 0.025);
    if (p1Fill >= 9.95) p2Fill = Math.min(1, p2Fill + 0.015);
  }
  if (step >= 2) panelOp = Math.max(0, panelOp - 0.045);

  updateOpacity();
  if (!frozen) maybeSpawn();
  particles = particles.filter(p=>{p.update();return p.alive;});

  drawBg();
  drawManagedArgoBox();
  drawPartitionPanel();
  drawStaticLines();
  drawLines();
  particles.forEach(p=>p.draw());
  drawNodes();
}

updateDots(); updateNarrative(); updateStepLabel();
setTimeout(()=>hintEl.classList.add('hidden'),4000);
loop();

// ── ArrowUp = prev scene, ArrowDown = next scene ─────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowUp')   { e.preventDefault(); window.parent.postMessage({type:'scene-back'},'*'); }
  if (e.code === 'ArrowDown') { e.preventDefault(); window.parent.postMessage({type:'scene-complete'},'*'); }
}, true);
</script>
