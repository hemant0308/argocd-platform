<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 6 — ApplicationSet Plugin Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#080B12; overflow:hidden;
      width:100vw; height:100vh;
      font-family:'Inter',-apple-system,sans-serif;
      cursor:pointer; user-select:none;
    }
    canvas { display:block; position:absolute; top:0; left:0; pointer-events:none; }

    #narrative {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      pointer-events:none; opacity:0; transition:opacity 1.2s ease;
    }
    #narrative.visible { opacity:1; }
    #nar-title {
      color:#fff; font-size:clamp(22px,3.2vw,52px);
      font-weight:700; letter-spacing:-0.025em;
      text-align:center; line-height:1.15; max-width:820px; padding:0 40px;
    }
    #nar-sub {
      margin-top:14px; color:rgba(255,255,255,0.42);
      font-size:clamp(13px,1.6vw,20px); text-align:center; padding:0 40px;
    }

    #scene-label {
      position:absolute; top:28px; left:36px;
      color:rgba(255,255,255,0.18); font-size:11px;
      letter-spacing:0.12em; text-transform:uppercase; font-weight:500; pointer-events:none;
    }
    #step-label {
      position:absolute; top:28px; right:36px;
      color:rgba(255,255,255,0.30); font-size:11.5px; letter-spacing:0.03em;
      font-weight:500; pointer-events:none; text-align:right; max-width:340px;
      transition:opacity 0.4s;
    }

    #legend {
      position:absolute; bottom:68px; right:32px;
      display:flex; flex-direction:column; gap:7px;
      opacity:0; transition:opacity 0.8s ease; pointer-events:none;
    }
    .leg-row { display:flex; align-items:center; gap:8px; }
    .leg-line { width:28px; height:3px; border-radius:2px; display:block; }
    .leg-text { font-size:11px; color:rgba(255,255,255,0.45); font-family:'Inter',sans-serif; letter-spacing:0.04em; }

    #progress {
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      display:flex; gap:7px; align-items:center; pointer-events:none;
    }
    .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.4s ease; }
    .dot.active { background:rgba(255,255,255,0.75); width:18px; border-radius:3px; }

    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.18); font-size:11px; letter-spacing:0.10em;
      text-transform:uppercase; pointer-events:none; white-space:nowrap; transition:opacity 0.5s;
    }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<div id="narrative"><h1 id="nar-title"></h1><p id="nar-sub"></p></div>
<div id="scene-label">Scene 6 &nbsp;/&nbsp; Plugin Generator</div>
<div id="step-label"></div>

<div id="legend">
  <div class="leg-row">
    <span class="leg-line" style="background:#60A5FA;box-shadow:0 0 6px #60A5FA;"></span>
    <span class="leg-text">ApplicationSet → API (poll request)</span>
  </div>
  <div class="leg-row">
    <span class="leg-line" style="background:#F59E0B;box-shadow:0 0 6px #F59E0B;"></span>
    <span class="leg-text">API → ApplicationSet (parameter response)</span>
  </div>
  <div class="leg-row">
    <span class="leg-line" style="background:#A78BFA;box-shadow:0 0 6px #A78BFA;"></span>
    <span class="leg-text">ApplicationSet → Application (creates)</span>
  </div>
  <div class="leg-row">
    <span class="leg-line" style="background:#4ADE80;box-shadow:0 0 6px #4ADE80;"></span>
    <span class="leg-text">Application → Cluster (reconcile)</span>
  </div>
</div>

<div id="hint">Click or press Space to continue</div>
<div id="progress"></div>

<script>
'use strict';

// ─── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize', resize);

// ─── ArgoCD icon — pre-rasterised once, blitted per frame ─────────────────────
const _argoImg = new Image();
let   _argoOC  = null;
_argoImg.onload = () => {
  const oc = document.createElement('canvas');
  oc.width = 64; oc.height = 64;
  oc.getContext('2d').drawImage(_argoImg, 0, 0, 64, 64);
  _argoOC = oc;
};
_argoImg.src = 'argocd-icon.svg';

// Draw [icon  text] as a centred unit at (cx, cy)
function drawArgoLabel(cx, cy, text, font, color, op, iconSz) {
  if (iconSz === undefined) iconSz = 15;
  ctx.save();
  ctx.font = font;
  const tw     = ctx.measureText(text).width;
  const gap    = 5;
  const totalW = iconSz + gap + tw;
  const ix     = cx - totalW / 2;
  ctx.globalAlpha  = op;
  ctx.shadowBlur   = 0;
  if (_argoOC) ctx.drawImage(_argoOC, ix, cy - iconSz / 2, iconSz, iconSz);
  ctx.fillStyle    = color;
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, ix + iconSz + gap, cy);
  ctx.restore();
}

// ─── ArgoCD box bounds ────────────────────────────────────────────────────────
const BOX = { x1:0.08, y1:0.26, x2:0.92, y2:0.73 };

// ─── Nodes ────────────────────────────────────────────────────────────────────
const NODES = {
  // Top: generic API Server
  apiserver: { rx:0.50, ry:0.09, type:'apiserver', label:'API Server', sub:'Returns parameter sets', step:0 },

  // Inside ArgoCD box: ApplicationSet
  appset:    { rx:0.50, ry:0.41, type:'appset', label:'ApplicationSet', sub:'Plugin Generator', step:0 },

  // Generated Applications (appear at step 3)
  app1: { rx:0.28, ry:0.60, type:'genapp', label:'Application', step:3 },
  app2: { rx:0.50, ry:0.62, type:'genapp', label:'Application', step:3 },
  app3: { rx:0.72, ry:0.60, type:'genapp', label:'Application', step:3 },

  // More apps (step 5 — API data changes)
  app4: { rx:0.14, ry:0.58, type:'genapp', label:'Application', step:5 },
  app5: { rx:0.86, ry:0.58, type:'genapp', label:'Application', step:5 },

  // Destination clusters (always visible)
  dc1: { rx:0.22, ry:0.86, type:'cluster', step:0 },
  dc2: { rx:0.50, ry:0.88, type:'cluster', step:0 },
  dc3: { rx:0.78, ry:0.86, type:'cluster', step:0 },

  // More clusters (step 5)
  dc4: { rx:0.08, ry:0.84, type:'cluster', step:5 },
  dc5: { rx:0.92, ry:0.84, type:'cluster', step:5 },
};

const opacity = {};
Object.keys(NODES).forEach(k => opacity[k] = 0);

// ─── Connections ──────────────────────────────────────────────────────────────
const CONNS = [
  { from:'appset',    to:'apiserver', step:1 },   // poll
  { from:'apiserver', to:'appset',    step:2 },   // response

  // AppSet → generated Applications (creation, step 3)
  { from:'appset', to:'app1', step:3 },
  { from:'appset', to:'app2', step:3 },
  { from:'appset', to:'app3', step:3 },
  { from:'appset', to:'app4', step:5 },
  { from:'appset', to:'app5', step:5 },

  { from:'app1', to:'dc1', step:4 },
  { from:'app2', to:'dc2', step:4 },
  { from:'app3', to:'dc3', step:4 },
  { from:'app4', to:'dc4', step:5 },
  { from:'app5', to:'dc5', step:5 },
];

// ─── State ────────────────────────────────────────────────────────────────────
let step       = 0;
const MAX_STEPS = 7; // 0–6
let particles  = [];
let frozen     = false;
let t          = 0;
let pulse      = 0;
let serverPulse = 0;  // spikes when API server "updates" at step 5

// ─── Particle ──────────────────────────────────────────────────────────────────
class Particle {
  constructor(from, to, col) {
    this.from = from; this.to = to; this.col = col;
    this.p    = 0;
    this.spd  = 0.007 + Math.random() * 0.004;
    this.r    = 2.0 + Math.random() * 1.4;
    this.bow  = { x:(Math.random()-.5)*.08, y:(Math.random()-.5)*.06 };
    this.alive = true;
  }
  pos() {
    const f=NODES[this.from], t2=NODES[this.to];
    const fx=f.rx*W, fy=f.ry*H, tx=t2.rx*W, ty=t2.ry*H;
    const cx=(fx+tx)/2+this.bow.x*Math.min(W,H);
    const cy=(fy+ty)/2+this.bow.y*Math.min(W,H);
    const u=1-this.p;
    return { x:u*u*fx+2*u*this.p*cx+this.p*this.p*tx,
             y:u*u*fy+2*u*this.p*cy+this.p*this.p*ty };
  }
  update() { this.p+=this.spd; if(this.p>=1) this.alive=false; }
  draw() {
    const {x,y}=this.pos();
    const alpha=Math.sin(this.p*Math.PI);
    ctx.save();
    ctx.globalAlpha=alpha*0.35;
    ctx.fillStyle=this.col; ctx.shadowColor=this.col; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(x,y,this.r*2.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=alpha*0.92; ctx.shadowBlur=4;
    ctx.beginPath(); ctx.arc(x,y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ─── Particle colour ───────────────────────────────────────────────────────────
function pColor(from, to) {
  if (from==='appset'    && to==='apiserver') return '#60A5FA'; // poll: blue
  if (from==='apiserver' && to==='appset')    return '#F59E0B'; // response: amber
  if (from==='appset'    && to.startsWith('app')) return '#A78BFA'; // creation: violet
  if (to==='dc1'||to==='dc2'||to==='dc3'||to==='dc4'||to==='dc5') return '#4ADE80'; // reconcile: green
  return '#60A5FA';
}

// ─── Spawn logic — step-aware ──────────────────────────────────────────────────
function spawnProbFor(c) {
  if (frozen || step === 0 || step >= 6) return 0;
  const isPoll     = c.from==='appset'    && c.to==='apiserver';
  const isResponse = c.from==='apiserver' && c.to==='appset';
  const isCreation = c.from==='appset'    && c.to.startsWith('app');
  const isReconcile= c.to.startsWith('dc');

  if (step === 1) return isPoll ? 0.028 : 0;
  if (step === 2) {
    if (isResponse) return 0.028;
    if (isPoll)     return 0.006;
    return 0;
  }
  if (step === 3) {
    if (isCreation) return 0.030;  // burst: appset creates apps
    if (isResponse||isPoll) return 0.005;
    return 0;
  }
  if (step === 4) {
    if (isReconcile) return 0.020;
    if (isCreation)  return 0.006; // trickle: appset still owns apps
    if (isResponse||isPoll) return 0.004;
    return 0;
  }
  if (step === 5) {
    if (isReconcile) return 0.020;
    if (isCreation)  return 0.022; // new apps being created
    if (isResponse)  return 0.014;
    if (isPoll)      return 0.008;
    return 0;
  }
  return 0;
}

function maybeSpawn() {
  CONNS.forEach(c => {
    if (c.step > step) return;
    const fo=opacity[c.from]||0, to=opacity[c.to]||0;
    if (fo<0.35||to<0.35) return;
    const prob = spawnProbFor(c);
    if (prob && Math.random()<prob)
      particles.push(new Particle(c.from, c.to, pColor(c.from, c.to)));
  });
}

// ─── Opacity targets ──────────────────────────────────────────────────────────
function opTarget(key) {
  const n=NODES[key];
  if (n.step > step) return 0;
  if (step >= 6) return 0.12;
  return 1;
}
function updateOpacity() {
  Object.keys(NODES).forEach(k => { opacity[k]+=(opTarget(k)-opacity[k])*0.028; });
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function rr(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// Pill label with monospace text
function drawPill(text, x, y, col, alpha) {
  if (alpha < 0.02) return;
  ctx.save();
  ctx.font = '500 10.5px "Courier New",Courier,monospace';
  const tw = ctx.measureText(text).width;
  const pw = tw + 18, ph = 22;
  ctx.globalAlpha = alpha * 0.90;
  ctx.fillStyle = 'rgba(6,10,20,0.92)';
  rr(x - pw/2, y - ph/2, pw, ph, 5); ctx.fill();
  ctx.strokeStyle = `${col}66`; ctx.lineWidth = 1;
  rr(x - pw/2, y - ph/2, pw, ph, 5); ctx.stroke();
  ctx.fillStyle = col;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ─── Background ───────────────────────────────────────────────────────────────
function drawBg() {
  ctx.fillStyle='#080B12'; ctx.fillRect(0,0,W,H);
  // Subtle blue glow around ArgoCD box
  const gx=0.50*W, gy=0.50*H, gr=Math.min(W,H)*0.52;
  const g=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
  g.addColorStop(0,'rgba(5,20,50,0.14)');
  g.addColorStop(0.5,'rgba(3,12,30,0.06)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

// ─── ArgoCD box ───────────────────────────────────────────────────────────────
function drawArgoBox() {
  const bx=BOX.x1*W, by=BOX.y1*H;
  const bw=(BOX.x2-BOX.x1)*W, bh=(BOX.y2-BOX.y1)*H;
  const hdrH = 34; // header band height
  const intOp=Math.max(opacity.appset||0, opacity.app1||0);
  if(intOp<0.01) return;
  ctx.save();

  // Subtle body fill
  ctx.globalAlpha=intOp*0.030;
  ctx.fillStyle='#3B82F6';
  rr(bx,by,bw,bh,18); ctx.fill();

  // Header band — top portion filled more prominently
  ctx.globalAlpha=intOp*0.12;
  ctx.fillStyle='#1D4ED8';
  // Clip to top-rounded only: draw a path covering top corners + rect body
  ctx.beginPath();
  ctx.moveTo(bx+18, by);
  ctx.lineTo(bx+bw-18, by);
  ctx.quadraticCurveTo(bx+bw, by, bx+bw, by+18);
  ctx.lineTo(bx+bw, by+hdrH);
  ctx.lineTo(bx, by+hdrH);
  ctx.lineTo(bx, by+18);
  ctx.quadraticCurveTo(bx, by, bx+18, by);
  ctx.closePath();
  ctx.fill();

  // Separator line below header
  ctx.globalAlpha=intOp*0.20;
  ctx.strokeStyle='rgba(96,165,250,0.5)'; ctx.lineWidth=1;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(bx+1, by+hdrH); ctx.lineTo(bx+bw-1, by+hdrH);
  ctx.stroke();

  // Full box border (dashed)
  ctx.globalAlpha=intOp*0.32;
  ctx.strokeStyle='rgba(96,165,250,0.60)'; ctx.lineWidth=1.5;
  ctx.setLineDash([8,12]);
  rr(bx,by,bw,bh,18); ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
  // Header label — ArgoCD icon + text centred as a unit
  drawArgoLabel(bx+bw/2, by+hdrH/2, 'ArgoCD', '700 14px Inter,sans-serif', '#93C5FD', intOp*0.80, 15);
}

// ─── Connection lines ──────────────────────────────────────────────────────────
function drawLines() {
  const drawn=new Set();
  CONNS.forEach(c => {
    if(c.step>step) return;
    const key=[c.from,c.to].sort().join('|');
    if(drawn.has(key)) return; drawn.add(key);
    const fo=opacity[c.from]||0, to2=opacity[c.to]||0;
    const lo=Math.min(fo,to2); if(lo<0.04) return;
    ctx.save();
    ctx.globalAlpha=lo*0.22;
    ctx.strokeStyle='rgba(80,140,210,0.5)';
    ctx.lineWidth=1; ctx.setLineDash([4,10]);
    ctx.lineDashOffset=-(t*0.28);
    ctx.beginPath();
    ctx.moveTo(NODES[c.from].rx*W,NODES[c.from].ry*H);
    ctx.lineTo(NODES[c.to].rx*W,  NODES[c.to].ry*H);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  });
}

// ─── Arrow annotation labels ───────────────────────────────────────────────────
function drawArrowLabels() {
  const ax=NODES.apiserver.rx*W, ay=NODES.apiserver.ry*H;
  const sx=NODES.appset.rx*W,    sy=NODES.appset.ry*H;
  const mx=(ax+sx)/2, my=(ay+sy)/2;
  // Offset labels to right of the vertical arrow
  const ox = Math.min(W*0.16, 135);

  // POST request label — visible step 1+
  const reqAlpha = step>=1 ? Math.min(opacity.apiserver, 1) : 0;
  if(reqAlpha>0.02)
    drawPill('POST  /api/v1/getparams.execute', mx+ox, my-14, '#60A5FA', reqAlpha*(step===1?1:0.45));

  // Response label — visible step 2+
  const resAlpha = step>=2 ? Math.min(opacity.apiserver, 1) : 0;
  if(resAlpha>0.02)
    drawPill('[{name, cluster, env…}, …]', mx+ox, my+14, '#F59E0B', resAlpha);
}

// ─── "New data" badge on API server (step 5) ──────────────────────────────────
function drawNewDataBadge() {
  if(serverPulse<0.02) return;
  const x=NODES.apiserver.rx*W, y=NODES.apiserver.ry*H;
  ctx.save();
  ctx.globalAlpha=serverPulse*0.9;
  ctx.fillStyle='#4ADE80'; ctx.font='600 10px Inter,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.shadowColor='#4ADE80'; ctx.shadowBlur=10;
  ctx.fillText('● data updated', x+80, y-4);
  ctx.restore();
}

// ─── Node draw functions ───────────────────────────────────────────────────────
function sz(type) {
  return { apiserver:[152,54], appset:[170,64], genapp:[114,40], cluster:[120,48] }[type] || [130,50];
}

function drawAPIServer(x,y,op) {
  const [w,h]=sz('apiserver'), px=x-w/2, py=y-h/2;
  const sp=serverPulse;
  const bl=16+sp*20+Math.sin(pulse*0.7)*4;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=sp>0.1?'rgba(74,222,128,0.55)':'rgba(96,165,250,0.40)';
  ctx.shadowBlur=bl;
  ctx.fillStyle='rgba(6,18,45,0.97)'; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=sp>0.1?`rgba(74,222,128,${0.5+sp*0.5})`:'rgba(96,165,250,0.68)';
  ctx.lineWidth=1.5; rr(px,py,w,h,10); ctx.stroke();
  ctx.fillStyle='#93C5FD'; ctx.font='600 13px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('API Server',x,y-6);
  ctx.fillStyle='rgba(147,197,253,0.48)'; ctx.font='500 10px Inter,sans-serif';
  ctx.fillText('Returns parameter sets',x,y+7);
  ctx.restore();
}

function drawAppSet(x,y,op) {
  const [w,h]=sz('appset'), px=x-w/2, py=y-h/2;
  const bl=18+Math.sin(pulse*0.8)*5;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(167,139,250,0.50)'; ctx.shadowBlur=bl;
  ctx.fillStyle='rgba(14,8,32,0.97)'; rr(px,py,w,h,12); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(139,92,246,0.75)'; ctx.lineWidth=2;
  rr(px,py,w,h,12); ctx.stroke();
  ctx.fillStyle='#C4B5FD'; ctx.font='700 14px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ApplicationSet',x,y-8);
  ctx.fillStyle='rgba(196,181,253,0.50)'; ctx.font='500 10.5px Inter,sans-serif';
  ctx.fillText('Plugin Generator',x,y+8);
  ctx.restore();
}

function drawGenApp(x,y,op) {
  const [w,h]=sz('genapp'), px=x-w/2, py=y-h/2;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(52,211,153,0.35)'; ctx.shadowBlur=12;
  ctx.fillStyle='rgba(3,18,12,0.96)'; rr(px,py,w,h,8); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(52,211,153,0.60)'; ctx.lineWidth=1;
  rr(px,py,w,h,8); ctx.stroke();
  ctx.fillStyle='#6EE7B7'; ctx.font='500 11px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Application',x,y);
  ctx.restore();
}

function drawCluster(x,y,op) {
  const [w,h]=sz('cluster'), px=x-w/2, py=y-h/2;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(59,130,246,0.38)'; ctx.shadowBlur=12;
  ctx.fillStyle='rgba(6,15,40,0.96)'; rr(px,py,w,h,9); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(59,130,246,0.62)'; ctx.lineWidth=1;
  rr(px,py,w,h,9); ctx.stroke();
  ctx.fillStyle='rgba(147,197,253,0.85)'; ctx.font='500 11px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('K8s Cluster',x,py+15);
  const nd=3, sp2=11, sx2=x-((nd-1)*sp2)/2, dy=py+h-13;
  for(let i=0;i<nd;i++){
    ctx.fillStyle='rgba(96,165,250,0.72)'; ctx.shadowColor='rgba(96,165,250,0.4)'; ctx.shadowBlur=3;
    ctx.beginPath(); ctx.arc(sx2+i*sp2,dy,2.8,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawNodes() {
  Object.entries(NODES).forEach(([k,n]) => {
    const op=opacity[k]; if(op<0.01) return;
    const x=n.rx*W, y=n.ry*H;
    switch(n.type){
      case 'apiserver': drawAPIServer(x,y,op); break;
      case 'appset':    drawAppSet(x,y,op); break;
      case 'genapp':    drawGenApp(x,y,op); break;
      case 'cluster':   drawCluster(x,y,op); break;
    }
  });
}

// ─── Step labels ──────────────────────────────────────────────────────────────
const LABELS = [
  'ApplicationSet Plugin Generator — how it works',
  'ArgoCD polls your API server periodically',
  'Your API returns a list of parameter sets',
  'One Application is created per parameter set',
  'Each Application reconciles to its destination cluster',
  'API data changes → ArgoCD adapts on the next poll',
  '',
];

const stepLabelEl = document.getElementById('step-label');
function updateStepLabel() {
  stepLabelEl.textContent = step < 6 ? LABELS[step] : '';
}

// ─── Narrative & Legend ───────────────────────────────────────────────────────
const narrativeEl=document.getElementById('narrative');
const narTitle=document.getElementById('nar-title');
const narSub=document.getElementById('nar-sub');
const legendEl=document.getElementById('legend');

function updateNarrative() {
  if(step===6){
    narTitle.textContent='Your API is the source of truth.';
    narSub.textContent  ='ArgoCD is the executor.';
    narrativeEl.classList.add('visible');
  } else {
    narrativeEl.classList.remove('visible');
  }
}
function updateLegend() {
  legendEl.style.opacity=(step>=1&&step<=5)?'1':'0';
}

// ─── Progress dots ────────────────────────────────────────────────────────────
const progressEl=document.getElementById('progress');
for(let i=0;i<MAX_STEPS;i++){
  const d=document.createElement('div');
  d.className='dot'; d.id='dot'+i; progressEl.appendChild(d);
}
function updateDots(){
  for(let i=0;i<MAX_STEPS;i++)
    document.getElementById('dot'+i).className='dot'+(i===step?' active':'');
}

// ─── Step advance ─────────────────────────────────────────────────────────────
const hintEl=document.getElementById('hint');
let hintTimer;
function advance(){
  if(step>=MAX_STEPS-1){ window.parent.postMessage({type:'scene-complete'},'*'); return; }
  const prev=step;
  step++;
  // Spike API server pulse when data "changes" at step 5
  if(prev===4&&step===5) serverPulse=1.0;
  if(step>=6){frozen=true; particles=[];}
  updateDots(); updateNarrative(); updateLegend(); updateStepLabel();
  hintEl.classList.remove('hidden');
  clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>hintEl.classList.add('hidden'),3000);
}
document.addEventListener('click', advance);
document.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault(); advance();}
  if(e.code==='ArrowLeft'&&step===0){window.parent.postMessage({type:'scene-back'},'*');return;}
  if(e.code==='ArrowLeft'&&step>0){
    step--;
    frozen=step>=6;
    if(!frozen) particles=[];
    serverPulse=0;
    updateDots(); updateNarrative(); updateLegend(); updateStepLabel();
  }
});

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  t++; pulse+=0.038;
  // Decay server pulse
  serverPulse*=0.975;
  updateOpacity();
  maybeSpawn();
  particles=particles.filter(p=>{p.update(); return p.alive;});
  drawBg();
  drawArgoBox();
  drawLines();
  particles.forEach(p=>p.draw());
  drawNodes();
  drawArrowLabels();
  drawNewDataBadge();
}

updateDots(); updateNarrative(); updateLegend(); updateStepLabel();
setTimeout(()=>hintEl.classList.add('hidden'),4000);
loop();

// ── ArrowUp = prev scene, ArrowDown = next scene ─────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowUp')   { e.preventDefault(); window.parent.postMessage({type:'scene-back'},'*'); }
  if (e.code === 'ArrowDown') { e.preventDefault(); window.parent.postMessage({type:'scene-complete'},'*'); }
}, true);
</script>
</body>
