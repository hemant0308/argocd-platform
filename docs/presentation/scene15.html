<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 15 — Summary</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#080B12; overflow:hidden; width:100vw; height:100vh; font-family:'Inter',-apple-system,sans-serif; cursor:default; user-select:none; }
    canvas { display:block; position:absolute; top:0; left:0; }
    #scene-label {
      position:absolute; top:28px; left:36px;
      color:rgba(255,255,255,0.18); font-size:11px;
      letter-spacing:0.12em; text-transform:uppercase; font-weight:500; pointer-events:none;
    }
    #back-hint {
      position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.14); font-size:10.5px; letter-spacing:0.10em;
      text-transform:uppercase; pointer-events:none; white-space:nowrap;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scene-label">Scene 15 &nbsp;/&nbsp; Summary</div>
<div id="back-hint">← ArrowLeft to go back</div>

<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// ── ArgoCD icon ───────────────────────────────────────────────────────────────
const _argoImg = new Image(); let _argoOC = null;
_argoImg.onload = () => {
  const oc = document.createElement('canvas');
  oc.width = 64; oc.height = 64;
  oc.getContext('2d').drawImage(_argoImg, 0, 0, 64, 64);
  _argoOC = oc;
  draw();
};
_argoImg.src = 'argocd-icon.svg';

// ── Pillar data ───────────────────────────────────────────────────────────────
const PILLARS = [
  { title: 'Git-Driven',             desc: 'AppSets and cluster config managed from Git',  col: '#F87171' },
  { title: 'Partitioned & Scalable', desc: 'Workloads distributed across a CP pool',       col: '#60A5FA' },
  { title: 'Event-Driven',           desc: 'Efficient reconciliation via Redis cache',      col: '#A78BFA' },
  { title: 'Intelligent Placement',  desc: 'CP assigned by region, load, and capacity',    col: '#34D399' },
  { title: 'Fault-Tolerant',         desc: 'Automatic failover and cluster re-association', col: '#F59E0B' },
];

const PERSONAS = [
  { label: 'Individual Cluster Owners',      col: '#60A5FA' },
  { label: 'Managed Service Platform Teams', col: '#F59E0B' },
  { label: 'Service Tenants',                col: '#F87171' },
];

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#080B12';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;

  // ── Section: Title ─────────────────────────────────────────────────────────
  const titleCY = H * 0.105;
  const iconSz  = Math.min(32, H * 0.036);
  const titleFs = Math.min(36, Math.max(20, W * 0.024));

  ctx.save();
  ctx.font = `700 ${titleFs}px Inter,sans-serif`;
  const titleW = ctx.measureText('What We Built').width;
  const totalTW = ((_argoOC ? iconSz + 10 : 0)) + titleW;
  const titleStartX = cx - totalTW / 2;

  if (_argoOC) {
    ctx.globalAlpha = 0.90;
    ctx.shadowColor = 'rgba(59,130,246,0.50)'; ctx.shadowBlur = 10;
    ctx.drawImage(_argoOC, titleStartX, titleCY - iconSz / 2, iconSz, iconSz);
    ctx.shadowBlur = 0;
  }

  ctx.globalAlpha = 1;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('What We Built', titleStartX + (_argoOC ? iconSz + 10 : 0), titleCY);

  const subFs = Math.min(13, Math.max(9, W * 0.009));
  ctx.globalAlpha = 0.38;
  ctx.font = `400 ${subFs}px Inter,sans-serif`;
  ctx.fillStyle = '#94A3B8'; ctx.textAlign = 'center';
  ctx.fillText(
    'A scalable, Git-driven GitOps platform for every cluster ownership model',
    cx, titleCY + titleFs * 0.72
  );
  ctx.restore();

  // ── Section: Pillars ───────────────────────────────────────────────────────
  const cardH   = Math.min(88, H * 0.100);
  const gapX    = 18;
  const rowGapY = 12;

  // Row 1 — 3 cards
  const cw1     = Math.min(380, (W * 0.88 - 2 * gapX) / 3);
  const row1X   = cx - (3 * cw1 + 2 * gapX) / 2;
  const row1Y   = H * 0.225;

  // Row 2 — 2 cards (centered, slightly wider)
  const cw2     = Math.min(430, (W * 0.72 - gapX) / 2);
  const row2X   = cx - (2 * cw2 + gapX) / 2;
  const row2Y   = row1Y + cardH + rowGapY;

  PILLARS.forEach((p, i) => {
    const row = i < 3 ? 0 : 1;
    const pos = i < 3 ? i : i - 3;
    const cw  = row === 0 ? cw1 : cw2;
    const px  = row === 0 ? row1X + pos * (cw1 + gapX) : row2X + pos * (cw2 + gapX);
    const py  = row === 0 ? row1Y : row2Y;

    ctx.save();
    // Card background
    ctx.fillStyle = 'rgba(4,10,24,0.97)'; rr(px, py, cw, cardH, 10); ctx.fill();
    // Left accent
    ctx.fillStyle = p.col; rr(px, py + 8, 3, cardH - 16, 2); ctx.fill();
    // Border
    ctx.globalAlpha = 0.28; ctx.strokeStyle = p.col; ctx.lineWidth = 1;
    rr(px, py, cw, cardH, 10); ctx.stroke();
    ctx.globalAlpha = 1;

    const textX  = px + 18;
    const titleY = py + cardH * 0.33;
    const descY  = py + cardH * 0.68;

    const tfs = Math.min(14, Math.max(10, W * 0.010));
    ctx.fillStyle = p.col;
    ctx.font = `700 ${tfs}px Inter,sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(p.title, textX, titleY);

    const dfs = Math.min(11, Math.max(9, W * 0.0082));
    ctx.globalAlpha = 0.60; ctx.fillStyle = '#CBD5E1';
    ctx.font = `400 ${dfs}px Inter,sans-serif`;
    ctx.fillText(p.desc, textX, descY);
    ctx.restore();
  });

  // ── Separator ─────────────────────────────────────────────────────────────
  const sepY = row2Y + cardH + H * 0.052;
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W * 0.12, sepY); ctx.lineTo(W * 0.88, sepY); ctx.stroke();
  ctx.restore();

  // ── Section: Personas ──────────────────────────────────────────────────────
  const personaY = sepY + H * 0.050;

  ctx.save();
  const pFs = Math.min(12, Math.max(9, W * 0.0085));
  ctx.font = `500 ${pFs}px Inter,sans-serif`;
  ctx.textBaseline = 'middle';

  // Measure total width first for centering
  const dot = '  ·  ';
  const dotW = ctx.measureText(dot).width;
  const pWidths = PERSONAS.map(p => ctx.measureText(p.label).width);
  const totalPW = pWidths.reduce((a, b) => a + b, 0) + 2 * dotW;
  let drawX = cx - totalPW / 2;

  PERSONAS.forEach((p, i) => {
    ctx.globalAlpha = 0.72; ctx.fillStyle = p.col;
    ctx.textAlign = 'left';
    ctx.fillText(p.label, drawX, personaY);
    drawX += pWidths[i];
    if (i < PERSONAS.length - 1) {
      ctx.globalAlpha = 0.22; ctx.fillStyle = '#64748B';
      ctx.fillText(dot, drawX, personaY);
      drawX += dotW;
    }
  });
  ctx.restore();

  // ── Section: Closing statement ────────────────────────────────────────────
  const line1Y = personaY + H * 0.072;
  const line2Y = line1Y + H * 0.046;

  const cfs1 = Math.min(22, Math.max(14, W * 0.015));
  const cfs2 = Math.min(16, Math.max(11, W * 0.011));

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.globalAlpha = 0.88;
  ctx.fillStyle = '#F8FAFC';
  ctx.font = `600 ${cfs1}px Inter,sans-serif`;
  ctx.fillText('One GitOps platform. 1000s of clusters.', cx, line1Y);

  ctx.globalAlpha = 0.52;
  ctx.fillStyle = '#94A3B8';
  ctx.font = `400 ${cfs2}px Inter,sans-serif`;
  ctx.fillText('No team needs to build or maintain their own deployment tooling.', cx, line2Y);
  ctx.restore();
}

// ── Events ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft') {
    window.parent.postMessage({ type: 'scene-back' }, '*');
  }
  // Space/ArrowRight: last scene — do nothing (or loop)
});
// Click does nothing on last scene

// ── Init ──────────────────────────────────────────────────────────────────────
resize(); draw();
document.fonts.ready.then(() => draw());
window.addEventListener('resize', () => { resize(); draw(); });

// ── ArrowUp = prev scene, ArrowDown = next scene ─────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowUp')   { e.preventDefault(); window.parent.postMessage({type:'scene-back'},'*'); }
  if (e.code === 'ArrowDown') { e.preventDefault(); window.parent.postMessage({type:'scene-complete'},'*'); }
}, true);
</script>
</body>
</html>
