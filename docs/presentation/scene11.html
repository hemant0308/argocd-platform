<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 7 — Partition the Load</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#080B12; overflow:hidden;
      width:100vw; height:100vh;
      font-family:'Inter',-apple-system,sans-serif;
      cursor:pointer; user-select:none;
    }
    canvas { display:block; position:absolute; top:0; left:0; pointer-events:none; }
    #narrative {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      pointer-events:none; opacity:0; transition:opacity 1.2s ease;
    }
    #narrative.visible { opacity:1; }
    #nar-title {
      color:#fff; font-size:clamp(22px,3.2vw,52px);
      font-weight:700; letter-spacing:-0.025em;
      text-align:center; line-height:1.15; max-width:820px; padding:0 40px;
    }
    #nar-sub {
      margin-top:14px; color:rgba(255,255,255,0.42);
      font-size:clamp(13px,1.6vw,20px); text-align:center; padding:0 40px;
    }
    #scene-label {
      position:absolute; top:28px; left:36px;
      color:rgba(255,255,255,0.18); font-size:11px;
      letter-spacing:0.12em; text-transform:uppercase; font-weight:500; pointer-events:none;
    }
    #step-label {
      position:absolute; top:28px; right:36px;
      color:rgba(255,255,255,0.30); font-size:11.5px; letter-spacing:0.03em;
      font-weight:500; pointer-events:none; text-align:right; max-width:520px;
    }
    #response-counter {
      position:absolute; bottom:68px; right:32px;
      font-family:'Courier New', Courier, monospace;
      font-size:13px; line-height:2.1;
      opacity:0; transition:opacity 0.6s ease;
      pointer-events:none; text-align:right;
    }
    #rc-before { color:#F87171; }
    #rc-after  { color:#4ADE80; font-weight:700; }
    #progress {
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      display:flex; gap:7px; align-items:center; pointer-events:none;
    }
    .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.4s ease; }
    .dot.active { background:rgba(255,255,255,0.75); width:18px; border-radius:3px; }
    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.18); font-size:11px; letter-spacing:0.10em;
      text-transform:uppercase; pointer-events:none; white-space:nowrap; transition:opacity 0.5s;
    }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="narrative"><h1 id="nar-title"></h1><p id="nar-sub"></p></div>
<div id="scene-label">Scene 11 &nbsp;/&nbsp; Partition the Load</div>
<div id="step-label"></div>
<div id="response-counter">
  <div id="rc-before"></div>
  <div id="rc-after"></div>
</div>
<div id="hint">Click or press Space to continue</div>
<div id="progress"></div>

<script>
'use strict';

// ─── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize', resize);

// ─── ArgoCD icon ──────────────────────────────────────────────────────────────
const _argoImg = new Image();
let   _argoOC  = null;
_argoImg.onload = () => {
  const oc = document.createElement('canvas');
  oc.width = 64; oc.height = 64;
  oc.getContext('2d').drawImage(_argoImg, 0, 0, 64, 64);
  _argoOC = oc;
};
_argoImg.src = 'argocd-icon.svg';

function drawArgoLabel(cx, cy, text, font, color, op, iconSz) {
  if (iconSz === undefined) iconSz = 15;
  ctx.save();
  ctx.font = font;
  const tw = ctx.measureText(text).width;
  const gap = 5, totalW = iconSz + gap + tw;
  const ix  = cx - totalW / 2;
  ctx.globalAlpha = op; ctx.shadowBlur = 0;
  if (_argoOC) ctx.drawImage(_argoOC, ix, cy - iconSz / 2, iconSz, iconSz);
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, ix + iconSz + gap, cy);
  ctx.restore();
}

// ─── Managed ArgoCD box ────────────────────────────────────────────────────────
const BOX = { x1:0.10, y1:0.17, x2:0.90, y2:0.72 };

// ─── Partition definitions ─────────────────────────────────────────────────────
const PARTITION_DEFS = [
  { appsetKey:'appset1', label:'AppSet-1', color:'#2DD4BF',
    glowColor:'rgba(45,212,191,0.45)',  bgColor:'rgba(4,22,22,0.97)',  borderColor:'rgba(45,212,191,0.70)',
    subLabel:'partition · 6 apps',
    cols:[0.22, 0.30], rows:[0.415, 0.495, 0.570] },
  { appsetKey:'appset2', label:'AppSet-2', color:'#A78BFA',
    glowColor:'rgba(167,139,250,0.45)', bgColor:'rgba(14,8,32,0.97)',  borderColor:'rgba(139,92,246,0.70)',
    subLabel:'partition · 6 apps',
    cols:[0.46, 0.54], rows:[0.415, 0.495, 0.570] },
  { appsetKey:'appset3', label:'AppSet-3', color:'#FB923C',
    glowColor:'rgba(251,146,60,0.45)',  bgColor:'rgba(24,12,4,0.97)',  borderColor:'rgba(251,146,60,0.70)',
    subLabel:'partition · 6 apps',
    cols:[0.70, 0.78], rows:[0.415, 0.495, 0.570] },
];

// ─── Nodes ────────────────────────────────────────────────────────────────────
const NODES = {
  platform:    { rx:0.50, ry:0.085, type:'platform',    step:0 },
  appsets_old: { rx:0.50, ry:0.295, type:'appsets_old', step:0 },
  appset1:     { rx:0.26, ry:0.295, type:'appset', pd:PARTITION_DEFS[0], step:2 },
  appset2:     { rx:0.50, ry:0.295, type:'appset', pd:PARTITION_DEFS[1], step:2 },
  appset3:     { rx:0.74, ry:0.295, type:'appset', pd:PARTITION_DEFS[2], step:2 },
  cp1: { rx:0.28, ry:0.82, type:'cp', label:'CP-1', step:0 },
  cp2: { rx:0.50, ry:0.82, type:'cp', label:'CP-2', step:0 },
  cp3: { rx:0.72, ry:0.82, type:'cp', label:'CP-3', step:0 },
};
const opacity = {};
Object.keys(NODES).forEach(k => opacity[k] = 0);

// ─── Connections (drive particles) ────────────────────────────────────────────
const CONNS = [
  { from:'appset1', to:'platform', step:4 },
  { from:'platform', to:'appset1', step:4 },
  { from:'appset2', to:'platform', step:4 },
  { from:'platform', to:'appset2', step:4 },
  { from:'appset3', to:'platform', step:4 },
  { from:'platform', to:'appset3', step:4 },
];

// ─── App node layout ──────────────────────────────────────────────────────────
// Cluster: 3 zones of 2 cols each, compactly centered at rx=0.50
// Zone 0 (pi=0): cols 0.35, 0.41  → will fly LEFT  to cols 0.22, 0.30
// Zone 1 (pi=1): cols 0.47, 0.53  → stays CENTER   at cols 0.46, 0.54
// Zone 2 (pi=2): cols 0.59, 0.65  → will fly RIGHT to cols 0.70, 0.78
const CLUSTER_COLS = [0.35, 0.41, 0.47, 0.53, 0.59, 0.65];
const CLUSTER_ROWS = [0.415, 0.495, 0.570];

const APP_DEFS = [];
PARTITION_DEFS.forEach((pd, pi) => {
  const cOff = pi * 2; // cluster column offset: 0, 2, 4
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 2; col++) {
      APP_DEFS.push({
        clusterRx: CLUSTER_COLS[cOff + col],
        clusterRy: CLUSTER_ROWS[row],
        finalRx:   pd.cols[col],
        finalRy:   pd.rows[row],
        pi,
      });
    }
  }
});

// ─── Easing ───────────────────────────────────────────────────────────────────
function easeInOut(t) {
  const c = Math.max(0, Math.min(1, t));
  return c < 0.5 ? 2*c*c : 1 - Math.pow(-2*c+2, 2)/2;
}
function lerp(a, b, t) { return a + (b - a) * t; }

// ─── AppNode class ────────────────────────────────────────────────────────────
class AppNode {
  constructor(def, idx) {
    this.startRx = def.clusterRx; this.startRy = def.clusterRy;
    this.finalRx = def.finalRx;   this.finalRy = def.finalRy;
    this.rx      = def.clusterRx; this.ry      = def.clusterRy; // current (interpolated)
    this.pi   = def.pi;
    this.idx  = idx;
    this.label = 'App-' + (idx + 1);
    this.cpIdx = idx % 3;
    this.op        = 0.25;  // visible dim from step 0
    this.targetOp  = 0.25;
    this.spawnDelay= 0;
    this.errored   = true;  // starts in crashed state
    this.distributing = false;
    this.animProgress = 0;
    this.animDelay    = 0;
  }

  update() {
    if (this.spawnDelay > 0) { this.spawnDelay--; return; }
    this.op += (this.targetOp - this.op) * 0.07;
    if (this.distributing) {
      if (this.animDelay > 0) {
        this.animDelay--;
      } else {
        this.animProgress = Math.min(1, this.animProgress + 0.045);
        const e = easeInOut(this.animProgress);
        this.rx = lerp(this.startRx, this.finalRx, e);
        this.ry = lerp(this.startRy, this.finalRy, e);
        if (this.animProgress >= 1) this.distributing = false;
      }
    }
  }

  draw() {
    if (this.op < 0.005) return;
    const x = this.rx * W, y = this.ry * H;
    const aw = 64, ah = 22, ar = 5;
    const pd     = PARTITION_DEFS[this.pi];
    const col    = this.errored ? '#F87171' : pd.color;
    const bgCol  = this.errored ? 'rgba(28,4,4,0.97)' : pd.bgColor;
    const border = this.errored ? 'rgba(239,68,68,0.55)' : pd.borderColor;
    ctx.save(); ctx.globalAlpha = this.op;
    ctx.shadowColor = col; ctx.shadowBlur = this.errored ? 3 : 7;
    ctx.fillStyle = bgCol; rr(x-aw/2, y-ah/2, aw, ah, ar); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = border; ctx.lineWidth = 1;
    rr(x-aw/2, y-ah/2, aw, ah, ar); ctx.stroke();
    ctx.fillStyle = this.errored ? 'rgba(252,165,165,0.80)' : `${pd.color}DD`;
    ctx.font = '500 9.5px Inter,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.label, x, y);
    ctx.restore();
  }

  drawToCP() {
    if (this.op < 0.03) return;
    const cpKey = ['cp1','cp2','cp3'][this.cpIdx];
    if ((opacity[cpKey] || 0) < 0.05) return;
    const cp = NODES[cpKey];
    const pd = PARTITION_DEFS[this.pi];
    ctx.save();
    ctx.globalAlpha = this.op * (this.errored ? 0.06 : 0.16);
    ctx.strokeStyle = this.errored ? '#EF4444' : pd.color;
    ctx.lineWidth = 0.8; ctx.setLineDash([3, 9]);
    ctx.beginPath();
    ctx.moveTo(this.rx*W, this.ry*H + 11);
    ctx.lineTo(cp.rx*W, cp.ry*H - 28);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
}

const appNodes = APP_DEFS.map((d, i) => new AppNode(d, i));

function startRedistribution() {
  appNodes.forEach((n, i) => {
    const withinPartition = i % 6;
    n.distributing = true;
    n.animProgress = 0;
    // pi * 8 frames between partition groups, +3 frames stagger within partition
    n.animDelay = n.pi * 8 + withinPartition * 3;
    n.errored   = false;
    n.targetOp  = 0.88;
  });
}

function dimAppsForNarrative() {
  appNodes.forEach(n => { n.targetOp = 0.10; n.spawnDelay = 0; });
}

// ─── State ────────────────────────────────────────────────────────────────────
let step             = 0;
const MAX_STEPS      = 8;
let particles        = [];
let frozen           = false;
let platformRecovery = 0;   // 0=crashed  1=healthy
let t = 0, pulse = 0;

// ─── Particle ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(from, to, col) {
    this.from = from; this.to = to; this.col = col;
    this.p   = 0;
    this.spd = 0.007 + Math.random() * 0.004;
    this.r   = 2.0 + Math.random() * 1.4;
    this.bow = { x:(Math.random()-.5)*0.04, y:(Math.random()-.5)*0.04 };
    this.alive = true;
  }
  pos() {
    const f=NODES[this.from], t2=NODES[this.to];
    const fx=f.rx*W, fy=f.ry*H, tx=t2.rx*W, ty=t2.ry*H;
    const cx=(fx+tx)/2+this.bow.x*Math.min(W,H);
    const cy=(fy+ty)/2+this.bow.y*Math.min(W,H);
    const u=1-this.p;
    return { x:u*u*fx+2*u*this.p*cx+this.p*this.p*tx,
             y:u*u*fy+2*u*this.p*cy+this.p*this.p*ty };
  }
  update() { this.p+=this.spd; if(this.p>=1) this.alive=false; }
  draw() {
    const {x,y}=this.pos();
    const a=Math.sin(this.p*Math.PI);
    ctx.save();
    ctx.globalAlpha=a*0.35; ctx.fillStyle=this.col; ctx.shadowColor=this.col; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(x,y,this.r*2.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=a*0.92; ctx.shadowBlur=4;
    ctx.beginPath(); ctx.arc(x,y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ─── Colour helpers ───────────────────────────────────────────────────────────
function lerpColor(a, b, f) {
  const cl=Math.max(0,Math.min(1,f));
  return [Math.round(a[0]+(b[0]-a[0])*cl), Math.round(a[1]+(b[1]-a[1])*cl), Math.round(a[2]+(b[2]-a[2])*cl)];
}

function pColor(from, to) {
  const respMap = { appset1:'#2DD4BF', appset2:'#A78BFA', appset3:'#FB923C' };
  if (from==='platform') return respMap[to] || '#4ADE80';
  return '#60A5FA';
}

function spawnProbFor(c) {
  if (frozen || step < 4 || step >= 7) return 0;
  const isResp = c.from === 'platform';
  const density = step === 4 ? 1 : step === 5 ? 1.4 : 1.8;
  return (isResp ? 0.022 : 0.016) * density;
}

function maybeSpawn() {
  CONNS.forEach(c => {
    if (c.step > step) return;
    const fo=opacity[c.from]||0, to2=opacity[c.to]||0;
    if (fo<0.35||to2<0.35) return;
    const prob=spawnProbFor(c);
    if (prob && Math.random()<prob) particles.push(new Particle(c.from,c.to,pColor(c.from,c.to)));
  });
}

// ─── Opacity ──────────────────────────────────────────────────────────────────
function opTarget(key) {
  if (step >= 7) return 0.12;
  if (key === 'appsets_old') return step >= 2 ? 0 : 0.62;
  const n = NODES[key];
  if (n.step > step) return 0;
  if (step === 0) {
    if (key === 'platform')         return 0.72;
    if (key.startsWith('cp'))      return 0.35;
  }
  return 1;
}

function updateOpacity() {
  Object.keys(NODES).forEach(k => { opacity[k]+=(opTarget(k)-opacity[k])*0.028; });
}

// ─── Rounded rect helper ──────────────────────────────────────────────────────
function rr(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ─── Background ───────────────────────────────────────────────────────────────
function drawBg() {
  ctx.fillStyle='#080B12'; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,Math.min(W,H)*0.55);
  g.addColorStop(0,'rgba(5,18,45,0.12)');
  g.addColorStop(0.5,'rgba(3,10,28,0.05)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

// ─── Managed ArgoCD box ───────────────────────────────────────────────────────
function drawManagedArgoBox() {
  const bx=BOX.x1*W, by=BOX.y1*H;
  const bw=(BOX.x2-BOX.x1)*W, bh=(BOX.y2-BOX.y1)*H;
  const hdrH=34;
  const intOp=Math.max(opacity.appsets_old, opacity.appset1, opacity.appset2, opacity.appset3)||0;
  if (intOp<0.01) return;
  ctx.save();
  ctx.globalAlpha=intOp*0.028; ctx.fillStyle='#3B82F6'; rr(bx,by,bw,bh,18); ctx.fill();
  ctx.globalAlpha=intOp*0.11; ctx.fillStyle='#1D4ED8';
  ctx.beginPath();
  ctx.moveTo(bx+18,by); ctx.lineTo(bx+bw-18,by);
  ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+18);
  ctx.lineTo(bx+bw,by+hdrH); ctx.lineTo(bx,by+hdrH);
  ctx.lineTo(bx,by+18); ctx.quadraticCurveTo(bx,by,bx+18,by);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=intOp*0.20; ctx.strokeStyle='rgba(96,165,250,0.5)'; ctx.lineWidth=1;
  ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(bx+1,by+hdrH); ctx.lineTo(bx+bw-1,by+hdrH); ctx.stroke();
  ctx.globalAlpha=intOp*0.32; ctx.strokeStyle='rgba(96,165,250,0.60)'; ctx.lineWidth=1.5;
  ctx.setLineDash([8,12]); rr(bx,by,bw,bh,18); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  drawArgoLabel(bx+bw/2, by+hdrH/2, 'Managed ArgoCD', '700 14px Inter,sans-serif', '#93C5FD', intOp*0.80, 15);
}

// ─── Fan lines: AppSet → its apps ─────────────────────────────────────────────
function drawAppFanLines() {
  // Step 0-1: dim red fan from crashed AppSet to the whole cluster
  const oldOp = opacity.appsets_old || 0;
  if (oldOp > 0.02) {
    const ax=NODES.appsets_old.rx*W, ay=NODES.appsets_old.ry*H+35;
    appNodes.forEach(n => {
      if (n.op < 0.02) return;
      ctx.save();
      ctx.globalAlpha=n.op*oldOp*0.07; ctx.strokeStyle='#EF4444'; ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(n.rx*W, n.ry*H-11); ctx.stroke();
      ctx.restore();
    });
  }
  // Step 2+: partition fans from each new AppSet → its apps (following app positions during redistribute)
  const starts = [0, 6, 12];
  ['appset1','appset2','appset3'].forEach((key, pi) => {
    const aOp=opacity[key]||0; if(aOp<0.02) return;
    const ax=NODES[key].rx*W, ay=NODES[key].ry*H+27;
    const col=PARTITION_DEFS[pi].color;
    appNodes.slice(starts[pi], starts[pi]+6).forEach(n => {
      if (n.op<0.02) return;
      ctx.save();
      ctx.globalAlpha=n.op*aOp*0.18;
      ctx.strokeStyle=n.errored?'rgba(239,68,68,0.5)':col; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(n.rx*W, n.ry*H-11); ctx.stroke();
      ctx.restore();
    });
  });
}

// ─── Particle connection lines ────────────────────────────────────────────────
function drawLines() {
  const drawn=new Set();
  CONNS.forEach(c=>{
    if(c.step>step) return;
    const key=[c.from,c.to].sort().join('|');
    if(drawn.has(key)) return; drawn.add(key);
    const fo=opacity[c.from]||0, to2=opacity[c.to]||0;
    const lo=Math.min(fo,to2); if(lo<0.04) return;
    ctx.save();
    ctx.globalAlpha=lo*0.18; ctx.strokeStyle='rgba(80,140,210,0.5)';
    ctx.lineWidth=1; ctx.setLineDash([4,10]);
    ctx.lineDashOffset=-(t*0.26);
    ctx.beginPath();
    ctx.moveTo(NODES[c.from].rx*W,NODES[c.from].ry*H);
    ctx.lineTo(NODES[c.to].rx*W,  NODES[c.to].ry*H);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  });
}

// ─── Platform Service ─────────────────────────────────────────────────────────
function drawPlatform(x, y, op) {
  const [w,h]=[172,58], px=x-w/2, py=y-h/2;
  const r = platformRecovery;
  const col    = lerpColor([120,20,20],[74,222,128], r);
  const colStr = `rgb(${col[0]},${col[1]},${col[2]})`;
  const bl     = 8 + r*14 + Math.sin(pulse*0.7)*4*r;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},0.42)`; ctx.shadowBlur=bl;
  ctx.fillStyle=r<0.5?'rgba(22,4,4,0.97)':'rgba(4,18,12,0.97)';
  rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=colStr; ctx.lineWidth=1.5;
  rr(px,py,w,h,10); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if (r < 0.5) {
    ctx.fillStyle='#FCA5A5'; ctx.font='700 13px Inter,sans-serif';
    ctx.fillText('✕  Platform Service', x, y-7);
    ctx.fillStyle='rgba(252,165,165,0.55)'; ctx.font='500 10px Inter,sans-serif';
    ctx.fillText('OOMKilled — pod terminated', x, y+7);
  } else {
    ctx.fillStyle=colStr; ctx.font='600 13px Inter,sans-serif';
    ctx.fillText('Platform Service', x, y-7);
    ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},0.50)`; ctx.font='500 10px Inter,sans-serif';
    ctx.fillText('Spring Boot — plugin generator', x, y+7);
  }
  ctx.restore();
}

// ─── Crashed ApplicationSet (step 0-1) ────────────────────────────────────────
function drawAppSetsOld(x, y, op) {
  const [w,h]=[190,70], px=x-w/2, py=y-h/2;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(239,68,68,0.18)'; ctx.shadowBlur=6;
  ctx.fillStyle='rgba(20,4,4,0.97)'; rr(px,py,w,h,14); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(127,29,29,0.55)'; ctx.lineWidth=1.5;
  ctx.setLineDash([5,9]); rr(px,py,w,h,14); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(252,165,165,0.48)'; ctx.font='500 9.5px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('controller crashed', x, y+9);
  ctx.restore();
  ctx.save(); ctx.globalAlpha=op*0.65;
  ctx.fillStyle='#FCA5A5'; ctx.font='700 13px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('✕  ApplicationSets', x, y-8);
  ctx.restore();
}

// ─── Partitioned AppSet node ───────────────────────────────────────────────────
function drawAppSet(x, y, op, n) {
  const pd=n.pd;
  const [w,h]=[160,54], px=x-w/2, py=y-h/2;
  const bl=14+Math.sin(pulse*0.8)*4;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=pd.glowColor; ctx.shadowBlur=bl;
  ctx.fillStyle=pd.bgColor; rr(px,py,w,h,12); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=pd.borderColor; ctx.lineWidth=1.5;
  rr(px,py,w,h,12); ctx.stroke();
  ctx.fillStyle=pd.color+'77'; ctx.font='500 9.5px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(pd.subLabel, x, y+8);
  ctx.restore();
  drawArgoLabel(x, y-8, pd.label, '600 12px Inter,sans-serif', pd.color, op, 12);
}

// ─── Control Plane ────────────────────────────────────────────────────────────
function drawCP(x, y, op, label) {
  const [w,h]=[138,56], px=x-w/2, py=y-h/2;
  const bl=14+Math.sin(pulse*0.65)*4;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(56,189,248,0.45)'; ctx.shadowBlur=bl;
  ctx.fillStyle='rgba(4,14,28,0.97)'; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(56,189,248,0.68)'; ctx.lineWidth=1.5;
  rr(px,py,w,h,10); ctx.stroke();
  ctx.fillStyle='rgba(125,211,252,0.45)'; ctx.font='500 10.5px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ArgoCD', x, y+8);
  ctx.restore();
  drawArgoLabel(x, y-7, label, '700 14px Inter,sans-serif', '#7DD3FC', op, 13);
}

function drawNodes() {
  Object.entries(NODES).forEach(([k,n]) => {
    const op=opacity[k]; if(op<0.005) return;
    const x=n.rx*W, y=n.ry*H;
    switch(n.type) {
      case 'platform':    drawPlatform(x,y,op); break;
      case 'appsets_old': drawAppSetsOld(x,y,op); break;
      case 'appset':      drawAppSet(x,y,op,n); break;
      case 'cp':          drawCP(x,y,op,n.label); break;
    }
  });
}

// ─── Step labels ──────────────────────────────────────────────────────────────
const LABELS = [
  'The ApplicationSet controller is down — OOMKilled',
  'Platform Service restarts — the system recovers',
  'Solution: split into multiple ApplicationSets',
  'Apps redistribute — each AppSet owns its partition',
  'Each partition polls independently — smaller requests',
  'Response per partition: ~170 KB  (was ~512 KB total)',
  'All partitions running — system is healthy and scalable',
  '',
];
const stepLabelEl = document.getElementById('step-label');
function updateStepLabel() {
  stepLabelEl.textContent = step < 7 ? LABELS[step] : '';
}

// ─── Narrative ────────────────────────────────────────────────────────────────
const narrativeEl = document.getElementById('narrative');
const narTitle    = document.getElementById('nar-title');
const narSub      = document.getElementById('nar-sub');
function updateNarrative() {
  if (step === 7) {
    narTitle.textContent = 'Partition the load. Each ApplicationSet polls for less.';
    narSub.textContent   = 'The platform scales.';
    narrativeEl.classList.add('visible');
  } else {
    narrativeEl.classList.remove('visible');
  }
}

// ─── Response counter ─────────────────────────────────────────────────────────
const rcEl     = document.getElementById('response-counter');
const rcBefore = document.getElementById('rc-before');
const rcAfter  = document.getElementById('rc-after');
function updateResponseCounter() {
  if (step < 5) { rcEl.style.opacity='0'; return; }
  rcEl.style.opacity='1';
  if (step === 5) {
    rcBefore.textContent = 'Before (1 AppSet)  :  ~512 KB';
    rcAfter.textContent  = 'Per partition      :  ~170 KB  ✓';
  } else {
    rcBefore.textContent = '';
    rcAfter.textContent  = 'Per partition  :  ~170 KB  ✓';
  }
}

// ─── Progress dots ────────────────────────────────────────────────────────────
const progressEl = document.getElementById('progress');
for (let i=0;i<MAX_STEPS;i++) {
  const d=document.createElement('div');
  d.className='dot'; d.id='dot'+i; progressEl.appendChild(d);
}
function updateDots() {
  for(let i=0;i<MAX_STEPS;i++)
    document.getElementById('dot'+i).className='dot'+(i===step?' active':'');
}

// ─── On step enter (forward) ──────────────────────────────────────────────────
function onStepEnter(s) {
  if (s === 3) startRedistribution();
  if (s === 7) { frozen=true; particles=[]; dimAppsForNarrative(); }
}

// ─── Advance / keyboard ───────────────────────────────────────────────────────
const hintEl = document.getElementById('hint');
let hintTimer;
function advance() {
  if (step>=MAX_STEPS-1) { window.parent.postMessage({type:'scene-complete'},'*'); return; }
  step++;
  onStepEnter(step);
  updateDots(); updateNarrative(); updateResponseCounter(); updateStepLabel();
  hintEl.classList.remove('hidden');
  clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>hintEl.classList.add('hidden'),3000);
}
document.addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if (e.code==='Space'||e.code==='ArrowRight') { e.preventDefault(); advance(); return; }
  if (e.code==='ArrowLeft'&&step===0){window.parent.postMessage({type:'scene-back'},'*');return;}
  if (e.code==='ArrowLeft'&&step>0) {
    step--;
    frozen = false;

    // Sync platformRecovery
    platformRecovery = step >= 1 ? 1 : 0;

    // Sync app nodes
    const shouldBeErrored = step < 3;
    appNodes.forEach(n => {
      n.errored      = shouldBeErrored;
      n.distributing = false;
      n.animDelay    = 0;
      if (shouldBeErrored) {
        // snap back to cluster positions
        n.animProgress = 0;
        n.rx = n.startRx; n.ry = n.startRy;
        n.targetOp = 0.25;
      } else {
        // snap to final positions
        n.animProgress = 1;
        n.rx = n.finalRx; n.ry = n.finalRy;
        n.targetOp = step >= 7 ? 0.10 : 0.88;
      }
    });

    updateDots(); updateNarrative(); updateResponseCounter(); updateStepLabel();
  }
});

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  t++; pulse+=0.038;
  if (step >= 1) platformRecovery = Math.min(1, platformRecovery + 0.018);
  updateOpacity();
  appNodes.forEach(n=>n.update());
  if (!frozen) maybeSpawn();
  particles = particles.filter(p=>{p.update();return p.alive;});
  drawBg();
  drawManagedArgoBox();
  drawLines();
  appNodes.forEach(n=>n.drawToCP());
  drawAppFanLines();
  particles.forEach(p=>p.draw());
  drawNodes();
  appNodes.forEach(n=>n.draw());
}

updateDots(); updateNarrative(); updateResponseCounter(); updateStepLabel();
setTimeout(()=>hintEl.classList.add('hidden'),4000);
loop();

// ── ArrowUp = prev scene, ArrowDown = next scene ─────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowUp')   { e.preventDefault(); window.parent.postMessage({type:'scene-back'},'*'); }
  if (e.code === 'ArrowDown') { e.preventDefault(); window.parent.postMessage({type:'scene-complete'},'*'); }
}, true);
</script>
</body>
