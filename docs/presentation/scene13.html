<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 9 — Event-Driven Regeneration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#080B12; overflow:hidden;
      width:100vw; height:100vh;
      font-family:'Inter',-apple-system,sans-serif;
      cursor:pointer; user-select:none;
    }
    canvas { display:block; position:absolute; top:0; left:0; pointer-events:none; }
    #narrative {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      pointer-events:none; opacity:0; transition:opacity 1.2s ease;
    }
    #narrative.visible { opacity:1; }
    #nar-title {
      color:#fff; font-size:clamp(20px,2.8vw,44px); font-weight:700;
      letter-spacing:-0.025em; text-align:center; line-height:1.2;
      max-width:820px; padding:0 40px;
    }
    #nar-sub {
      margin-top:14px; color:rgba(255,255,255,0.42);
      font-size:clamp(13px,1.4vw,19px); text-align:center; padding:0 40px;
    }
    #scene-label {
      position:absolute; top:28px; left:36px;
      color:rgba(255,255,255,0.18); font-size:11px;
      letter-spacing:0.12em; text-transform:uppercase; font-weight:500; pointer-events:none;
    }
    #step-label {
      position:absolute; top:28px; right:36px;
      color:rgba(255,255,255,0.30); font-size:11.5px; letter-spacing:0.03em;
      font-weight:500; pointer-events:none; text-align:right; max-width:660px;
    }
    #progress {
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      display:flex; gap:7px; align-items:center; pointer-events:none;
    }
    .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.4s ease; }
    .dot.active { background:rgba(255,255,255,0.75); width:18px; border-radius:3px; }
    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.18); font-size:11px; letter-spacing:0.10em;
      text-transform:uppercase; pointer-events:none; white-space:nowrap; transition:opacity 0.5s;
    }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="narrative"><h1 id="nar-title"></h1><p id="nar-sub"></p></div>
<div id="scene-label">Scene 13 &nbsp;/&nbsp; Event-Driven Regeneration</div>
<div id="step-label"></div>
<div id="hint">Click or press Space to continue</div>
<div id="progress"></div>

<script>
'use strict';

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}
resize(); window.addEventListener('resize', resize);

// ─── ArgoCD icon ──────────────────────────────────────────────────────────────
const _argoImg = new Image();
let _argoOC = null;
_argoImg.onload = () => {
  const oc = document.createElement('canvas'); oc.width = 64; oc.height = 64;
  oc.getContext('2d').drawImage(_argoImg, 0, 0, 64, 64); _argoOC = oc;
};
_argoImg.src = 'argocd-icon.svg';

function drawArgoLabel(cx, cy, text, font, color, op, iconSz) {
  if (!iconSz) iconSz = 14;
  ctx.save(); ctx.font = font;
  const tw = ctx.measureText(text).width, gap = 5, totalW = iconSz + gap + tw;
  const ix = cx - totalW / 2;
  ctx.globalAlpha = op; ctx.shadowBlur = 0;
  if (_argoOC) ctx.drawImage(_argoOC, ix, cy - iconSz / 2, iconSz, iconSz);
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, ix + iconSz + gap, cy);
  ctx.restore();
}

// ─── Vertical layout ──────────────────────────────────────────────────────────
// All main nodes are centered horizontally at rx = 0.50
const NODES = {
  postgres:  { rx:0.50, ry:0.085 },
  redis:     { rx:0.50, ry:0.280 },
  platform:  { rx:0.50, ry:0.462 },
  l1_appset: { rx:0.50, ry:0.625 },
  part001:   { rx:0.22, ry:0.840 },
  part002:   { rx:0.50, ry:0.840 },
  part003:   { rx:0.78, ry:0.840 },
};

// Managed ArgoCD bounding box (bottom)
const ARGOBOX = { x1:0.07, y1:0.555, x2:0.93, y2:0.955 };

// ─── Global opacity envelope ──────────────────────────────────────────────────
let sceneOp = 0;
function updateNop() { sceneOp += ((step >= 6 ? 0.10 : 1) - sceneOp) * 0.030; }

// ─── Animated values ──────────────────────────────────────────────────────────
const A = {
  mutFlash:   0,  // write request flash on Platform Service (step 1)
  genBump:    0,  // PostgreSQL gen counter bumped (step 1+)
  evict:      0,  // Redis partition-002 evicted (step 2)
  cacheMiss:  0,  // Platform shows MISS decision (step 3)
  dbQuery:    0,  // PostgreSQL being queried (step 3)
  repop:      0,  // Redis repopulated (step 3+)
  p2Detect:   0,  // partition-002 detected as changed (step 3+)
  p2Recon:    0,  // partition-002 reconciling (step 4)
  p2Synced:   0,  // partition-002 synced/complete (step 4+)
  quiet:      0,  // partition-001/003 quiet indicator (step 5+)
};

function tickAnim() {
  const s = step, sp = 0.040;
  A.mutFlash  += ((s === 1 ? 1 : 0) - A.mutFlash)  * sp * 1.5;
  A.genBump   += ((s >= 1 ? 1 : 0) - A.genBump)    * sp;
  A.evict     += ((s >= 2 && s <= 3 ? 1 : 0) - A.evict) * sp * 1.4;
  A.cacheMiss += ((s === 3 ? 1 : 0) - A.cacheMiss) * sp * 1.6;
  A.dbQuery   += ((s === 3 ? 1 : 0) - A.dbQuery)   * sp * 1.3;
  A.repop     += ((s >= 3 ? 1 : 0) - A.repop)      * sp;
  A.p2Detect  += ((s >= 3 ? 1 : 0) - A.p2Detect)   * sp;
  A.p2Recon   += ((s === 4 ? 1 : 0) - A.p2Recon)   * sp * 1.3;
  A.p2Synced  += ((s >= 4 ? 1 : 0) - A.p2Synced)   * sp;
  A.quiet     += ((s >= 5 ? 1 : 0) - A.quiet)      * sp;
}

// ─── Particles ────────────────────────────────────────────────────────────────
// bxSign: -1 = left-lean (upward/request), +1 = right-lean (downward/response)
const CONNS = [
  // Step 0 — steady state: poll flow (up) + hit response (down)
  { from:'l1_appset', to:'platform',  minS:0, maxS:0, col:'#60A5FA', rate:0.016, bxSign:-1 },
  { from:'platform',  to:'redis',     minS:0, maxS:0, col:'#A78BFA', rate:0.020, bxSign:-1 },
  { from:'redis',     to:'platform',  minS:0, maxS:0, col:'#C4B5FD', rate:0.020, bxSign:+1 },
  { from:'platform',  to:'l1_appset', minS:0, maxS:0, col:'#93C5FD', rate:0.016, bxSign:+1 },
  // Step 1 — mutation write: Platform → PostgreSQL (up) + ack (down)
  { from:'platform',  to:'postgres',  minS:1, maxS:1, col:'#FBBF24', rate:0.028, bxSign:-1 },
  { from:'postgres',  to:'platform',  minS:1, maxS:1, col:'#4ADE80', rate:0.020, bxSign:+1 },
  // Step 2 — eviction signal: Platform → Redis (red)
  { from:'platform',  to:'redis',     minS:2, maxS:2, col:'#EF4444', rate:0.025, bxSign:-1 },
  // Step 3 — cache miss: poll, miss check, DB query, repopulate, serve
  { from:'l1_appset', to:'platform',  minS:3, maxS:3, col:'#F59E0B', rate:0.022, bxSign:-1 },
  { from:'platform',  to:'postgres',  minS:3, maxS:3, col:'#2DD4BF', rate:0.026, bxSign:-1 },
  { from:'postgres',  to:'platform',  minS:3, maxS:3, col:'#34D399', rate:0.022, bxSign:+1 },
  { from:'platform',  to:'redis',     minS:3, maxS:3, col:'#34D399', rate:0.020, bxSign:+1 },
  { from:'platform',  to:'l1_appset', minS:3, maxS:3, col:'#93C5FD', rate:0.018, bxSign:+1 },
  // Step 4 — normal cache-hit flow resumes
  { from:'l1_appset', to:'platform',  minS:4, maxS:4, col:'#60A5FA', rate:0.014, bxSign:-1 },
  { from:'platform',  to:'redis',     minS:4, maxS:4, col:'#A78BFA', rate:0.016, bxSign:-1 },
  { from:'redis',     to:'platform',  minS:4, maxS:4, col:'#C4B5FD', rate:0.016, bxSign:+1 },
  { from:'platform',  to:'l1_appset', minS:4, maxS:4, col:'#93C5FD', rate:0.014, bxSign:+1 },
  // Partition AppSets → Platform Service (5-min poll — very slow particles, all steps)
  { from:'part001', to:'platform', minS:0, maxS:5, col:'#64748B', rate:0.004, bxSign:-1, speed:0.0018 },
  { from:'part002', to:'platform', minS:0, maxS:5, col:'#64748B', rate:0.004, bxSign:-1, speed:0.0018 },
  { from:'part003', to:'platform', minS:0, maxS:5, col:'#64748B', rate:0.004, bxSign:+1, speed:0.0018 },
];

let particles = [];
const BX_AMP = 0.022; // horizontal arc amplitude for vertical lanes

class Particle {
  constructor(c) {
    this.from = c.from; this.to = c.to; this.col = c.col;
    this.p   = 0;
    this.spd = c.speed ? c.speed + Math.random() * c.speed * 0.4
                       : 0.006 + Math.random() * 0.006;
    this.r   = 1.6 + Math.random() * 1.0;
    this.bx  = c.bxSign * BX_AMP + (Math.random() - 0.5) * 0.006;
    this.by  = (Math.random() - 0.5) * 0.008;
    this.alive = true;
  }
  pos() {
    const f = NODES[this.from], t = NODES[this.to];
    const S = Math.min(W, H);
    const fx=f.rx*W, fy=f.ry*H, tx=t.rx*W, ty=t.ry*H;
    const cx=(fx+tx)/2+this.bx*S, cy=(fy+ty)/2+this.by*S;
    const u=1-this.p;
    return { x:u*u*fx+2*u*this.p*cx+this.p*this.p*tx,
             y:u*u*fy+2*u*this.p*cy+this.p*this.p*ty };
  }
  update() { this.p += this.spd; if (this.p >= 1) this.alive = false; }
  draw() {
    const { x, y } = this.pos(), a = Math.sin(this.p * Math.PI);
    ctx.save();
    ctx.globalAlpha = a * 0.28; ctx.fillStyle = this.col;
    ctx.shadowColor = this.col; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(x, y, this.r * 2.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = a * 0.90; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(x, y, this.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function maybeSpawn() {
  if (step >= 6) return;
  CONNS.forEach(c => {
    if (step < c.minS || step > c.maxS) return;
    if (Math.random() < c.rate) particles.push(new Particle(c));
  });
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// ─── Draw: background ─────────────────────────────────────────────────────────
function drawBg() {
  ctx.fillStyle = '#080B12'; ctx.fillRect(0, 0, W, H);
}

// ─── Draw: vertical connector lines ───────────────────────────────────────────
function drawConnLines() {
  const op = sceneOp * 0.15; if (op < 0.005) return;

  // ── Main vertical stack lines (postgres↔redis↔platform) ──
  const pairs = [['postgres','redis'],['redis','platform']];
  pairs.forEach(([a, b]) => {
    const na=NODES[a], nb=NODES[b];
    ctx.save(); ctx.globalAlpha = op;
    ctx.strokeStyle='rgba(99,130,190,0.55)'; ctx.lineWidth=1; ctx.setLineDash([4,10]);
    ctx.beginPath(); ctx.moveTo(na.rx*W,na.ry*H); ctx.lineTo(nb.rx*W,nb.ry*H); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  });

  // ── platform ↔ l1_appset with "10 s" label ──
  {
    const na=NODES.platform, nb=NODES.l1_appset;
    const mx=(na.rx*W+nb.rx*W)/2, my=(na.ry*H+nb.ry*H)/2;
    ctx.save(); ctx.globalAlpha = op;
    ctx.strokeStyle='rgba(99,130,190,0.55)'; ctx.lineWidth=1; ctx.setLineDash([4,10]);
    ctx.beginPath(); ctx.moveTo(na.rx*W,na.ry*H); ctx.lineTo(nb.rx*W,nb.ry*H); ctx.stroke();
    ctx.setLineDash([]);
    // "10 s" badge
    ctx.globalAlpha = sceneOp * 0.55;
    ctx.fillStyle = 'rgba(96,165,250,0.10)'; rr(mx+8,my-10,52,20,4); ctx.fill();
    ctx.strokeStyle = 'rgba(96,165,250,0.28)'; ctx.lineWidth=0.8;
    rr(mx+8,my-10,52,20,4); ctx.stroke();
    ctx.fillStyle = '#93C5FD'; ctx.font = '600 9px Inter,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('polls 10 s', mx+34, my);
    ctx.restore();
  }

  // ── Partition AppSets → Platform Service (5-min poll lines + label) ──
  ['part001','part002','part003'].forEach((k, i) => {
    const pt=NODES[k], pl=NODES.platform;
    const dimMult = (k!=='part002' && A.quiet > 0.1) ? (1 - A.quiet * 0.55) : 1;
    ctx.save(); ctx.globalAlpha = op * 0.70 * dimMult;
    ctx.strokeStyle = 'rgba(100,116,139,0.45)'; ctx.lineWidth=1; ctx.setLineDash([3,12]);
    ctx.beginPath(); ctx.moveTo(pt.rx*W,pt.ry*H); ctx.lineTo(pl.rx*W,pl.ry*H); ctx.stroke();
    ctx.setLineDash([]);
    // "5 min" label only on part002 (center, applies to all 3)
    if (i === 1) {
      const mx=(pt.rx*W+pl.rx*W)/2, my=(pt.ry*H+pl.ry*H)/2;
      ctx.globalAlpha = sceneOp * 0.48 * dimMult;
      ctx.fillStyle = 'rgba(100,116,139,0.12)'; rr(mx+8,my-10,54,20,4); ctx.fill();
      ctx.strokeStyle = 'rgba(100,116,139,0.28)'; ctx.lineWidth=0.8;
      rr(mx+8,my-10,54,20,4); ctx.stroke();
      ctx.fillStyle = '#94A3B8'; ctx.font = '600 9px Inter,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('polls 5 min', mx+35, my);
    }
    ctx.restore();
  });

  // ── L1 → partition fan-out (inside ArgoCD box) ──
  ['part001','part002','part003'].forEach(k => {
    const l1=NODES.l1_appset, pt=NODES[k];
    const isP2 = k==='part002';
    const lineCol = (isP2 && A.p2Detect > 0.2)
      ? `rgba(245,158,11,${0.35+A.p2Detect*0.30})`
      : (isP2 && A.p2Synced > 0.2)
      ? `rgba(52,211,153,${0.30+A.p2Synced*0.25})`
      : 'rgba(99,130,190,0.30)';
    const dimMult = (!isP2 && A.quiet > 0.1) ? (1 - A.quiet * 0.65) : 1;
    ctx.save(); ctx.globalAlpha = op * dimMult;
    ctx.strokeStyle = lineCol; ctx.lineWidth = 1; ctx.setLineDash([3,9]);
    ctx.beginPath(); ctx.moveTo(l1.rx*W,l1.ry*H); ctx.lineTo(pt.rx*W,pt.ry*H); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  });
}

// ─── Draw: PostgreSQL box ─────────────────────────────────────────────────────
function drawPostgres() {
  const n=NODES.postgres, op=sceneOp; if (op < 0.01) return;
  const cx=n.rx*W, cy=n.ry*H;
  const [w,h]=[280,70], px=cx-w/2, py=cy-h/2;
  const isQueried = A.dbQuery > 0.1;
  const col = isQueried ? '#34D399' : 'rgba(74,222,128,0.65)';

  ctx.save(); ctx.globalAlpha = op;
  ctx.shadowColor = isQueried ? 'rgba(52,211,153,0.50)' : 'rgba(74,222,128,0.28)';
  ctx.shadowBlur  = 10 + (isQueried ? A.dbQuery * 22 : 0) + Math.sin(pulse*.6)*3;
  ctx.fillStyle = 'rgba(4,14,8,0.97)'; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  rr(px,py,w,h,10); ctx.stroke();

  // Cylinder icon (mini DB)
  const dbX=px+16, dbY=cy-10, dbW=22, dbH=20;
  ctx.globalAlpha = op * 0.55;
  ctx.fillStyle = '#14532D'; ctx.beginPath();
  ctx.ellipse(dbX+dbW/2,dbY,dbW/2,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillRect(dbX,dbY,dbW,dbH);
  ctx.fillStyle='#16a34a'; ctx.beginPath();
  ctx.ellipse(dbX+dbW/2,dbY+dbH,dbW/2,5,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#22c55e'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(dbX,dbY); ctx.lineTo(dbX,dbY+dbH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(dbX+dbW,dbY); ctx.lineTo(dbX+dbW,dbY+dbH); ctx.stroke();

  ctx.globalAlpha = op;
  ctx.fillStyle = '#4ADE80'; ctx.font='700 12px Inter,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('PostgreSQL', px+46, cy-9);

  // Generation counter
  const genText = A.genBump < 0.05
    ? 'partition-002.generation: 41'
    : A.genBump < 0.80
    ? `partition-002.generation: 41 → 42`
    : 'partition-002.generation: 42  ✓';
  const genCol = A.genBump < 0.05 ? 'rgba(148,163,184,0.55)'
               : A.genBump < 0.80 ? `rgba(251,191,36,${A.genBump})`
               : '#34D399';
  ctx.fillStyle = genCol; ctx.font='500 9px "Courier New",monospace';
  ctx.fillText(genText, px+46, cy+9);
  ctx.restore();
}

// ─── Draw: Redis Cache box ────────────────────────────────────────────────────
function drawRedis() {
  const n=NODES.redis, op=sceneOp; if (op < 0.01) return;
  const cx=n.rx*W, cy=n.ry*H;
  const [w,h]=[300,130], px=cx-w/2, py=cy-h/2;
  const hdr=28;

  ctx.save(); ctx.globalAlpha = op;
  ctx.shadowColor='rgba(167,139,250,0.30)'; ctx.shadowBlur=10+Math.sin(pulse*.55)*3;
  ctx.fillStyle='rgba(8,5,22,0.97)'; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(167,139,250,0.55)'; ctx.lineWidth=1.5;
  rr(px,py,w,h,10); ctx.stroke();
  ctx.globalAlpha=op*0.09; ctx.fillStyle='#7C3AED';
  ctx.beginPath(); ctx.moveTo(px+10,py); ctx.lineTo(px+w-10,py);
  ctx.quadraticCurveTo(px+w,py,px+w,py+10); ctx.lineTo(px+w,py+hdr);
  ctx.lineTo(px,py+hdr); ctx.lineTo(px,py+10);
  ctx.quadraticCurveTo(px,py,px+10,py); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=op;
  ctx.fillStyle='#A78BFA'; ctx.font='700 11px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Redis Cache', cx, py+hdr/2);

  // Cache entry rows
  const rowH=30, rows=[
    { label:'partition-001', gen:28, idx:0 },
    { label:'partition-002', gen: A.genBump > 0.5 ? 42 : 41, idx:1 },
    { label:'partition-003', gen:15, idx:2 },
  ];
  rows.forEach(({ label, gen, idx }) => {
    const ry = py + hdr + 8 + idx * rowH + rowH/2;
    const isP2 = idx === 1;
    let tagText='HIT', tagCol='#34D399', rowBg='rgba(52,211,153,0.07)';
    if (isP2) {
      if (A.evict > 0.2 && A.repop < 0.25) {
        tagText='EVICTED'; tagCol='#EF4444'; rowBg='rgba(239,68,68,0.10)';
      } else if (A.repop >= 0.25) {
        tagText='REPOPULATED'; tagCol='#2DD4BF'; rowBg='rgba(45,212,191,0.09)';
      }
    }
    ctx.globalAlpha=op;
    ctx.fillStyle=rowBg; rr(px+10,ry-12,w-20,24,4); ctx.fill();
    ctx.fillStyle='rgba(148,163,184,0.80)'; ctx.font='500 9px "Courier New",monospace';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(`${label}  gen:${gen}`, px+18, ry);
    ctx.fillStyle=tagCol; ctx.font='700 8px Inter,sans-serif';
    ctx.textAlign='right'; ctx.fillText(tagText, px+w-14, ry);
  });
  ctx.restore();
}

// ─── Draw: Platform Service box ───────────────────────────────────────────────
function drawPlatform() {
  const n=NODES.platform, op=sceneOp; if (op < 0.01) return;
  const cx=n.rx*W, cy=n.ry*H;
  const [w,h]=[320,92], px=cx-w/2, py=cy-h/2;
  const hdr=28;
  const isWrite = A.mutFlash > 0.1;
  const isMiss  = A.cacheMiss > 0.1;
  const col = isWrite ? `rgba(251,191,36,${0.55+A.mutFlash*0.35})`
            : isMiss  ? `rgba(45,212,191,${0.55+A.cacheMiss*0.30})`
            : 'rgba(96,165,250,0.60)';

  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=isWrite?'rgba(251,191,36,0.35)':isMiss?'rgba(45,212,191,0.30)':'rgba(96,165,250,0.22)';
  ctx.shadowBlur=12+(isWrite?A.mutFlash*24:0)+(isMiss?A.cacheMiss*18:0)+Math.sin(pulse*.6)*3;
  ctx.fillStyle='rgba(4,10,24,0.97)'; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=col; ctx.lineWidth=1.5;
  rr(px,py,w,h,10); ctx.stroke();
  ctx.globalAlpha=op*0.09; ctx.fillStyle='#1D4ED8';
  ctx.beginPath(); ctx.moveTo(px+10,py); ctx.lineTo(px+w-10,py);
  ctx.quadraticCurveTo(px+w,py,px+w,py+10); ctx.lineTo(px+w,py+hdr);
  ctx.lineTo(px,py+hdr); ctx.lineTo(px,py+10);
  ctx.quadraticCurveTo(px,py,px+10,py); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=op;
  ctx.fillStyle='#93C5FD'; ctx.font='700 12px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Platform Service', cx, py+hdr/2);

  // Decision / status label
  let status='', statusCol='';
  if (A.mutFlash > 0.08)        { status='Writing to PostgreSQL — generation bumped'; statusCol='#FBBF24'; }
  else if (A.evict > 0.08 && step===2) { status='Evicting partition-002 cache key'; statusCol='#EF4444'; }
  else if (A.cacheMiss > 0.08)  { status='Cache MISS for partition-002 — querying PostgreSQL'; statusCol='#2DD4BF'; }
  else if (A.repop > 0.4)       { status='Cache HIT — serving cached response'; statusCol='#34D399'; }
  else if (step === 0)           { status='Cache HIT — serving cached response'; statusCol='#34D399'; }

  if (status) {
    const sBright = Math.max(A.mutFlash, A.evict, A.cacheMiss, A.repop, step===0?1:0);
    ctx.globalAlpha=op*Math.min(1, sBright+0.3);
    ctx.fillStyle=statusCol; ctx.font='500 9.5px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(status, cx, cy+6);
  }

  // PartitionChangedEvent badge (step 1-2)
  if (A.genBump > 0.05 && A.repop < 0.3) {
    const pEvtOp = Math.min(1, A.genBump * 1.5) * (1 - A.repop * 2);
    if (pEvtOp > 0.05) {
      ctx.globalAlpha = op * pEvtOp;
      ctx.fillStyle = 'rgba(251,191,36,0.15)';
      rr(cx-108, py+h-22, 216, 16, 4); ctx.fill();
      ctx.fillStyle = '#FBBF24'; ctx.font = '600 8px Inter,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('PartitionChangedEvent  →  CacheInvalidationListener', cx, py+h-14);
    }
  }
  ctx.restore();

  // "Write request" indicator (left of Platform Service box, step 1)
  if (A.mutFlash > 0.08) {
    const badgeX = px - 14, badgeY = cy;
    ctx.save(); ctx.globalAlpha = op * A.mutFlash;
    ctx.fillStyle = 'rgba(251,191,36,0.14)'; rr(badgeX-110,badgeY-14,110,28,6); ctx.fill();
    ctx.strokeStyle = 'rgba(251,191,36,0.55)'; ctx.lineWidth=1;
    rr(badgeX-110,badgeY-14,110,28,6); ctx.stroke();
    ctx.fillStyle='#FBBF24'; ctx.font='600 9px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('New App Write', badgeX-55, badgeY);
    // Arrow →
    ctx.strokeStyle='rgba(251,191,36,0.75)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(badgeX,badgeY); ctx.lineTo(px,badgeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px-6,badgeY-4); ctx.lineTo(px,badgeY); ctx.lineTo(px-6,badgeY+4); ctx.stroke();
    ctx.restore();
  }
}

// ─── Draw: Managed ArgoCD box ─────────────────────────────────────────────────
function drawArgoBox() {
  const op=sceneOp; if (op < 0.01) return;
  const bx=ARGOBOX.x1*W, by=ARGOBOX.y1*H, bw=(ARGOBOX.x2-ARGOBOX.x1)*W, bh=(ARGOBOX.y2-ARGOBOX.y1)*H;
  const hdr=30;
  ctx.save();
  ctx.globalAlpha=op*0.022; ctx.fillStyle='#3B82F6'; rr(bx,by,bw,bh,18); ctx.fill();
  ctx.globalAlpha=op*0.08;  ctx.fillStyle='#1D4ED8';
  ctx.beginPath(); ctx.moveTo(bx+18,by); ctx.lineTo(bx+bw-18,by);
  ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+18); ctx.lineTo(bx+bw,by+hdr);
  ctx.lineTo(bx,by+hdr); ctx.lineTo(bx,by+18);
  ctx.quadraticCurveTo(bx,by,bx+18,by); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=op*0.22; ctx.strokeStyle='rgba(96,165,250,0.48)'; ctx.lineWidth=1.5;
  ctx.setLineDash([8,14]); rr(bx,by,bw,bh,18); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  drawArgoLabel(bx+bw/2, by+hdr/2, 'Managed ArgoCD', '700 13px Inter,sans-serif', '#93C5FD', op*0.75, 14);
}

// ─── Draw: L1 AppSet node (inside ArgoCD box) ─────────────────────────────────
function drawL1() {
  const n=NODES.l1_appset, op=sceneOp; if (op < 0.01) return;
  const cx=n.rx*W, cy=n.ry*H;
  const [w,h]=[218,52], px=cx-w/2, py=cy-h/2;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(74,222,128,0.38)'; ctx.shadowBlur=10+Math.sin(pulse*.6)*3;
  ctx.fillStyle='rgba(4,14,8,0.97)'; rr(px,py,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(74,222,128,0.62)'; ctx.lineWidth=1.5;
  rr(px,py,w,h,10); ctx.stroke();
  ctx.fillStyle='rgba(74,222,128,0.45)'; ctx.font='500 9.5px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('polls every 10 s', cx, cy+9);
  ctx.restore();
  drawArgoLabel(cx, cy-8, 'L1 ApplicationSet', '700 12.5px Inter,sans-serif', '#4ADE80', op, 13);
}

// ─── Draw: Partition AppSet boxes (inside ArgoCD box) ─────────────────────────
function drawPartition(key, idx) {
  const n=NODES[key], op=sceneOp; if (op < 0.005) return;
  const cx=n.rx*W, cy=n.ry*H;
  const isP2 = key === 'part002';
  const [w,h]=[162,66], px=cx-w/2, py=cy-h/2;

  let col='#7DD3FC';
  if (isP2) {
    if (A.p2Detect > 0.15 && A.p2Recon < 0.1) {
      const d=A.p2Detect;
      col=`rgb(${Math.round(125+(245-125)*d)},${Math.round(211+(158-211)*d)},${Math.round(252+(11-252)*d)})`;
    } else if (A.p2Recon > 0.1) {
      col='#2DD4BF';
    } else if (A.p2Synced > 0.5) {
      col='#34D399';
    }
  }
  const dimMult = (!isP2 && A.quiet > 0.1) ? (1 - A.quiet * 0.60) : 1;
  const PART_GENS = [28, 41, 15];
  const gen = idx===1 ? (A.genBump > 0.5 ? 42 : 41) : PART_GENS[idx];

  ctx.save(); ctx.globalAlpha=op*dimMult;
  ctx.shadowColor=`${col}45`; ctx.shadowBlur=10+Math.sin(pulse*.7)*3;
  ctx.fillStyle='rgba(4,10,24,0.97)'; rr(px,py,w,h,8); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=col;
  ctx.globalAlpha=op*dimMult*(0.50+(isP2?A.p2Detect*0.30:0));
  ctx.lineWidth=1.5; rr(px,py,w,h,8); ctx.stroke();
  ctx.globalAlpha=op*dimMult;
  ctx.fillStyle=col; ctx.font='500 8.5px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`gen: ${gen}`, cx, cy+10);

  if (isP2) {
    let badge='', bCol='';
    if (A.p2Detect>0.2 && A.p2Recon<0.1) { badge='CHANGED'; bCol='#F59E0B'; }
    else if (A.p2Recon>0.1) { badge='RECONCILING'; bCol='#2DD4BF'; }
    else if (A.p2Synced>0.6) { badge='✓ SYNCED'; bCol='#34D399'; }
    if (badge) {
      ctx.globalAlpha=op*Math.min(1,A.p2Detect+A.p2Recon+A.p2Synced);
      ctx.fillStyle=bCol; ctx.font='700 7.5px Inter,sans-serif';
      ctx.fillText(badge, cx, cy+22);
    }
  } else if (A.quiet > 0.2) {
    ctx.globalAlpha=op*A.quiet*0.60*dimMult;
    ctx.fillStyle='rgba(148,163,184,0.65)'; ctx.font='600 7.5px Inter,sans-serif';
    ctx.fillText('no change', cx, cy+22);
  }
  ctx.restore();
  drawArgoLabel(cx, cy-12, `Partition-00${idx+1}`, '600 10px Inter,sans-serif', col, op*dimMult, 11);
}

// ─── Draw: "quiet" badge (step 5) ────────────────────────────────────────────
function drawQuietBadge(key) {
  if (A.quiet < 0.15) return;
  const n=NODES[key], op=sceneOp;
  const cx=n.rx*W, cy=n.ry*H+42;
  ctx.save(); ctx.globalAlpha=op*A.quiet*0.65;
  ctx.fillStyle='rgba(148,163,184,0.12)'; rr(cx-68,cy-11,136,22,5); ctx.fill();
  ctx.fillStyle='rgba(148,163,184,0.60)'; ctx.font='500 8px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('0 DB queries  ·  0 reconciliations', cx, cy);
  ctx.restore();
}

// ─── Scene state ──────────────────────────────────────────────────────────────
let step = 0;
const MAX_STEPS = 7;
let t = 0, pulse = 0, frozen = false;

const LABELS = [
  'Steady state — AppSets poll Platform Service — Platform Service hits Redis — PostgreSQL untouched',
  'New application registered — Platform Service writes to PostgreSQL — partition-002 generation bumped 41 → 42',
  'PartitionChangedEvent fires — Platform Service evicts partition-002 cache key — partition-001 and 003 untouched',
  'L1 AppSet polls — Platform Service checks Redis — partition-002 MISS — queries PostgreSQL — cache repopulated',
  'Only partition-002 AppSet reconciles — generates new applications on the control plane',
  'Partition-001 and Partition-003 — zero DB queries — zero reconciliations — cache entries remain valid',
  '',
];

const stepLabelEl = document.getElementById('step-label');
const narrativeEl = document.getElementById('narrative');
const narTitle    = document.getElementById('nar-title');
const narSub      = document.getElementById('nar-sub');
const progressEl  = document.getElementById('progress');
const hintEl      = document.getElementById('hint');

for (let i=0;i<MAX_STEPS;i++) {
  const d=document.createElement('div'); d.className='dot'; d.id='dot'+i;
  progressEl.appendChild(d);
}

function updateUI() {
  stepLabelEl.textContent = step < 6 ? LABELS[step] : '';
  if (step === 6) {
    narTitle.textContent = 'One mutation. One partition reconciles. The rest stay silent.';
    narSub.textContent   = 'Redis absorbs steady-state load. Generation changes propagate in ≤ 10 seconds.';
    narrativeEl.classList.add('visible');
  } else {
    narrativeEl.classList.remove('visible');
  }
  for (let i=0;i<MAX_STEPS;i++)
    document.getElementById('dot'+i).className='dot'+(i===step?' active':'');
}

let hintTimer;
function advance() {
  if (step >= MAX_STEPS-1) { window.parent.postMessage({type:'scene-complete'},'*'); return; }
  step++;
  if (step===6) { frozen=true; particles=[]; }
  updateUI();
  hintEl.classList.remove('hidden');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 3000);
}

document.addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if (e.code==='Space'||e.code==='ArrowRight') { e.preventDefault(); advance(); return; }
  if (e.code==='ArrowLeft'&&step===0) { window.parent.postMessage({type:'scene-back'},'*'); return; }
  if (e.code==='ArrowLeft'&&step>0)  { step--; frozen=false; particles=[]; updateUI(); }
});

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  t++; pulse += 0.038;
  tickAnim(); updateNop();
  if (!frozen) maybeSpawn();
  particles = particles.filter(p => { p.update(); return p.alive; });
  drawBg();
  drawConnLines();
  particles.forEach(p => p.draw());
  drawArgoBox();
  drawPostgres();
  drawRedis();
  drawPlatform();
  drawL1();
  drawPartition('part001', 0);
  drawPartition('part002', 1);
  drawPartition('part003', 2);
  if (A.quiet > 0.1) { drawQuietBadge('part001'); drawQuietBadge('part003'); }
}

updateUI();
setTimeout(() => hintEl.classList.add('hidden'), 4000);
loop();

// ── ArrowUp = prev scene, ArrowDown = next scene ─────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowUp')   { e.preventDefault(); window.parent.postMessage({type:'scene-back'},'*'); }
  if (e.code === 'ArrowDown') { e.preventDefault(); window.parent.postMessage({type:'scene-complete'},'*'); }
}, true);
</script>
