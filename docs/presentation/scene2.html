<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 2 — The Opportunity</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#080B12; overflow:hidden; width:100vw; height:100vh; font-family:'Inter',-apple-system,sans-serif; cursor:pointer; user-select:none; }
    canvas { display:block; position:absolute; top:0; left:0; pointer-events:none; }
    #scene-label {
      position:absolute; top:28px; left:36px;
      color:rgba(255,255,255,0.18); font-size:11px;
      letter-spacing:0.12em; text-transform:uppercase; font-weight:500; pointer-events:none;
    }
    #progress {
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      display:flex; gap:7px; align-items:center; pointer-events:none;
    }
    .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.4s ease; }
    .dot.active { background:rgba(255,255,255,0.75); width:18px; border-radius:3px; }
    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.18); font-size:11px; letter-spacing:0.10em;
      text-transform:uppercase; pointer-events:none; white-space:nowrap; transition:opacity 0.5s;
    }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scene-label">Scene 2 &nbsp;/&nbsp; The Opportunity</div>
<div id="hint">Click or press Space to continue</div>
<div id="progress"></div>

<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}
resize(); window.addEventListener('resize', resize);

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// ── Persona data ──────────────────────────────────────────────────────────────
const PERSONAS = [
  {
    rx: 0.20,
    title:  ['Individual', 'Cluster Owners'],
    lines:  [
      'Own and manage their clusters',
      'Deploy workloads directly',
      'Single- or multi-region',
    ],
    col:  '#60A5FA',
    fill: 0.82,
  },
  {
    rx: 0.50,
    title:  ['Managed Service', 'Platform Teams'],
    lines:  [
      'Operate clusters to provision',
      'services for other teams',
      'Manage controllers & lifecycle',
    ],
    col:  '#F59E0B',
    fill: 0.46,
  },
  {
    rx: 0.80,
    title:  ['Service', 'Tenants'],
    lines:  [
      'Deploy into provisioned compute',
      'Own a namespace, not the cluster',
      'Bounded to assigned partition',
    ],
    col:  '#F87171',
    fill: 0.13,
  },
];

// ── Animation scalars ─────────────────────────────────────────────────────────
const A = {
  hero:  0,
  card0: 0, card1: 0, card2: 0,
  bars:  0,
  bottom: 0,
};

let step = 0, MAX_STEPS = 6, pulse = 0;

function tickAnim() {
  const sp = 0.034;
  A.hero   += ((step >= 0 ? 1 : 0) - A.hero)   * sp;
  A.card0  += ((step >= 1 ? 1 : 0) - A.card0)  * sp * 1.1;
  A.card1  += ((step >= 2 ? 1 : 0) - A.card1)  * sp * 1.1;
  A.card2  += ((step >= 3 ? 1 : 0) - A.card2)  * sp * 1.1;
  A.bars   += ((step >= 4 ? 1 : 0) - A.bars)   * sp * 0.8;
  A.bottom += ((step >= 5 ? 1 : 0) - A.bottom) * sp;
}

// ── Draw: background ─────────────────────────────────────────────────────────
function drawBg() { ctx.fillStyle = '#080B12'; ctx.fillRect(0, 0, W, H); }

// ── Draw: hero stat ───────────────────────────────────────────────────────────
function drawHero() {
  const op = A.hero; if (op < 0.01) return;
  const cx = W / 2, cy = H * 0.15;

  // Large number
  const numSize = Math.min(78, Math.max(42, H * 0.086));
  ctx.save();
  ctx.globalAlpha = op;
  ctx.font = `700 ${numSize}px Inter,sans-serif`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(96,165,250,0.30)'; ctx.shadowBlur = 30;
  ctx.fillText('1000s', cx, cy);

  // Sub-label
  const subSize = Math.min(15, Math.max(10, W * 0.010));
  ctx.globalAlpha = op * 0.48;
  ctx.shadowBlur = 0;
  ctx.font = `500 ${subSize}px Inter,sans-serif`;
  ctx.fillStyle = '#94A3B8';
  ctx.fillText('of Kubernetes clusters — most workloads already running on K8s', cx, cy + numSize * 0.68);

  ctx.globalAlpha = op * 0.30;
  ctx.font = `400 ${subSize}px Inter,sans-serif`;
  ctx.fillStyle = '#64748B';
  ctx.fillText('Each team building and maintaining their own deployment tooling', cx, cy + numSize * 0.68 + subSize + 5);
  ctx.restore();
}

// ── Draw: persona card ────────────────────────────────────────────────────────
function drawCard(p, op) {
  if (op < 0.01) return;

  const cw   = Math.min(370, W * 0.265);
  const ch   = Math.min(268, H * 0.340);
  const cx   = p.rx * W;
  const cy   = H * 0.560;
  const px   = cx - cw / 2;
  const py   = cy - ch / 2;

  ctx.save();
  ctx.globalAlpha = op;

  // Glow
  ctx.shadowColor = `${p.col}35`; ctx.shadowBlur = 14 + Math.sin(pulse * 0.6) * 4;
  ctx.fillStyle = 'rgba(4,10,24,0.97)'; rr(px, py, cw, ch, 13); ctx.fill();
  ctx.shadowBlur = 0;

  // Border
  ctx.strokeStyle = p.col; ctx.globalAlpha = op * 0.42; ctx.lineWidth = 1.5;
  rr(px, py, cw, ch, 13); ctx.stroke();

  // Top accent bar
  ctx.globalAlpha = op * 0.70; ctx.strokeStyle = p.col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px + 16, py); ctx.lineTo(px + cw - 16, py); ctx.stroke();

  ctx.globalAlpha = op;

  // Title lines
  const titleSize = Math.min(15, Math.max(11, W * 0.011));
  ctx.fillStyle = p.col;
  ctx.font = `700 ${titleSize}px Inter,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const titleLineH = titleSize + 5;
  p.title.forEach((line, i) => {
    ctx.fillText(line, cx, py + 34 + i * titleLineH);
  });

  // Divider
  ctx.globalAlpha = op * 0.18;
  ctx.strokeStyle = p.col; ctx.lineWidth = 1; ctx.setLineDash([3, 6]);
  const divY = py + 34 + p.title.length * titleLineH + 10;
  ctx.beginPath(); ctx.moveTo(px + 20, divY); ctx.lineTo(px + cw - 20, divY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = op;

  // Description lines
  const descSize = Math.min(11, Math.max(9, W * 0.0082));
  const descLineH = descSize + 7;
  const descStartY = divY + 14;
  ctx.fillStyle = 'rgba(148,163,184,0.72)';
  ctx.font = `400 ${descSize}px Inter,sans-serif`;
  ctx.textAlign = 'center';
  p.lines.forEach((line, i) => {
    ctx.fillText(line, cx, descStartY + i * descLineH);
  });

  // Coverage bar (bottom of card)
  const barW  = cw * 0.70;
  const barH  = 7;
  const barX  = cx - barW / 2;
  const barY  = py + ch - 30;
  const filled = p.fill * A.bars;

  // Track
  ctx.globalAlpha = op * 0.22;
  ctx.fillStyle = '#334155';
  rr(barX, barY, barW, barH, 3); ctx.fill();

  // Fill
  if (filled > 0.005) {
    ctx.globalAlpha = op * 0.82;
    ctx.fillStyle   = p.col;
    ctx.shadowColor = p.col; ctx.shadowBlur = 8;
    rr(barX, barY, barW * filled, barH, 3); ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ── Draw: bottom statement ────────────────────────────────────────────────────
function drawBottom() {
  const op = A.bottom; if (op < 0.01) return;
  const cx = W / 2, cy = H * 0.875;
  const lineW = Math.min(720, W * 0.70);

  ctx.save();

  // Separator line
  ctx.globalAlpha = op * 0.22;
  ctx.strokeStyle = 'rgba(96,165,250,0.50)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - lineW / 2, cy - 20); ctx.lineTo(cx + lineW / 2, cy - 20); ctx.stroke();

  // Statement
  const fs = Math.min(17, Math.max(12, W * 0.012));
  ctx.globalAlpha = op * 0.80;
  ctx.font = `500 ${fs}px Inter,sans-serif`;
  ctx.fillStyle = '#E2E8F0';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('One platform.  No team needs to build or maintain their own deployment tooling.', cx, cy + 6);

  ctx.restore();
}

// ── Progress & controls ───────────────────────────────────────────────────────
const progressEl = document.getElementById('progress');
const hintEl     = document.getElementById('hint');
for (let i = 0; i < MAX_STEPS; i++) {
  const d = document.createElement('div'); d.className = 'dot'; d.id = 'dot' + i;
  progressEl.appendChild(d);
}
function updateUI() {
  for (let i = 0; i < MAX_STEPS; i++)
    document.getElementById('dot' + i).className = 'dot' + (i === step ? ' active' : '');
}

let hintTimer;
function advance() {
  if (step >= MAX_STEPS - 1) { window.parent.postMessage({ type: 'scene-complete' }, '*'); return; }
  step++;
  updateUI();
  hintEl.classList.remove('hidden');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 3000);
}

document.addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); advance(); return; }
  if (e.code === 'ArrowLeft' && step === 0) { window.parent.postMessage({ type: 'scene-back' }, '*'); return; }
  if (e.code === 'ArrowLeft' && step > 0) { step--; updateUI(); }
});

// ── Main loop ─────────────────────────────────────────────────────────────────
const CARD_OPS = [() => A.card0, () => A.card1, () => A.card2];

function loop() {
  requestAnimationFrame(loop);
  pulse += 0.030;
  tickAnim();
  drawBg();
  drawHero();
  PERSONAS.forEach((p, i) => drawCard(p, CARD_OPS[i]()));
  drawBottom();
}

updateUI();
setTimeout(() => hintEl.classList.add('hidden'), 4000);
loop();

// ── ArrowUp = prev scene, ArrowDown = next scene ─────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowUp')   { e.preventDefault(); window.parent.postMessage({type:'scene-back'},'*'); }
  if (e.code === 'ArrowDown') { e.preventDefault(); window.parent.postMessage({type:'scene-complete'},'*'); }
}, true);
</script>
</body>
</html>
