<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 9 — Cluster & App Lifecycle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#080B12; overflow:hidden;
      width:100vw; height:100vh;
      font-family:'Inter',-apple-system,sans-serif;
      cursor:pointer; user-select:none;
    }
    canvas { display:block; position:absolute; top:0; left:0; pointer-events:none; }
    #narrative {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      pointer-events:none; opacity:0; transition:opacity 1.2s ease;
    }
    #narrative.visible { opacity:1; }
    #nar-title {
      color:#fff; font-size:clamp(20px,2.8vw,44px); font-weight:700;
      letter-spacing:-0.025em; text-align:center; line-height:1.2; max-width:820px; padding:0 40px;
    }
    #nar-sub {
      margin-top:14px; color:rgba(255,255,255,0.42);
      font-size:clamp(13px,1.4vw,19px); text-align:center; padding:0 40px;
    }
    #scene-label {
      position:absolute; top:28px; left:36px;
      color:rgba(255,255,255,0.18); font-size:11px;
      letter-spacing:0.12em; text-transform:uppercase; font-weight:500; pointer-events:none;
    }
    #step-label {
      position:absolute; top:28px; right:36px;
      color:rgba(255,255,255,0.30); font-size:11.5px; letter-spacing:0.03em;
      font-weight:500; pointer-events:none; text-align:right; max-width:640px;
    }
    #progress {
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      display:flex; gap:7px; align-items:center; pointer-events:none;
    }
    .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.4s ease; }
    .dot.active { background:rgba(255,255,255,0.75); width:18px; border-radius:3px; }
    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.18); font-size:11px; letter-spacing:0.10em;
      text-transform:uppercase; pointer-events:none; white-space:nowrap; transition:opacity 0.5s;
    }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="narrative"><h1 id="nar-title"></h1><p id="nar-sub"></p></div>
<div id="scene-label">Scene 9 &nbsp;/&nbsp; Cluster &amp; App Lifecycle</div>
<div id="step-label"></div>
<div id="hint">Click or press Space to continue</div>
<div id="progress"></div>

<script>
'use strict';

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W=0, H=0;
function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
}
resize(); window.addEventListener('resize',resize);

// ─── ArgoCD icon ──────────────────────────────────────────────────────────────
const _argoImg=new Image(); let _argoOC=null;
_argoImg.onload=()=>{ const oc=document.createElement('canvas'); oc.width=64; oc.height=64; oc.getContext('2d').drawImage(_argoImg,0,0,64,64); _argoOC=oc; };
_argoImg.src='argocd-icon.svg';
function drawArgoLabel(cx,cy,text,font,color,op,iconSz){
  if(!iconSz)iconSz=14; ctx.save(); ctx.font=font;
  const tw=ctx.measureText(text).width,gap=5,totalW=iconSz+gap+tw,ix=cx-totalW/2;
  ctx.globalAlpha=op; ctx.shadowBlur=0;
  if(_argoOC)ctx.drawImage(_argoOC,ix,cy-iconSz/2,iconSz,iconSz);
  ctx.fillStyle=color; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(text,ix+iconSz+gap,cy); ctx.restore();
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// ─── Layout (relative to canvas) ──────────────────────────────────────────────
// Top-left: Platform Service box
// Center:   CP Pool (CP-1, CP-2, CP-3)
// Right:    Cluster-to-CP assignment box
// Bottom:   Applications under each CP

const PLAT = { rx:0.18, ry:0.22 };            // Platform Service
const CP   = [
  { rx:0.38, ry:0.50, id:'CP-1' },
  { rx:0.60, ry:0.50, id:'CP-2' },
  { rx:0.82, ry:0.50, id:'CP-3' },
];
// Clusters: assigned to CPs
// Step 3 onward: CL-1 → CP-2 (assigned)
const CLUSTER = { rx:0.18, ry:0.52, id:'CL-1' };

// Apps under each CP (appear step 5)
const APPS = [
  { rx:0.38, ry:0.78, label:'APP-1', cpIdx:0 },
  { rx:0.60, ry:0.78, label:'APP-2', cpIdx:1 },
];

// Request badge (POST /clusters) — appears step 1
const REQ_CLUSTER = { rx:0.18, ry:0.36 };

// ─── Animated scalars ─────────────────────────────────────────────────────────
const A = {
  plat:      0,
  cpPool:    0,
  reqCluster:0,
  clIncoming:0,
  clAssigned:0,
  assignLine:0,
  reqApp:    0,
  appDeploy: 0,
  genBump:   0,
};

function tickAnim(){
  const sp=0.035;
  A.plat       += ((step>=0?1:0)-A.plat)*sp;
  A.cpPool     += ((step>=0?1:0)-A.cpPool)*sp*0.9;
  A.reqCluster += ((step>=1?1:0)-A.reqCluster)*sp*1.4;
  A.clIncoming += ((step>=1?1:0)-A.clIncoming)*sp*1.2;
  A.clAssigned += ((step>=3?1:0)-A.clAssigned)*sp;
  A.assignLine += ((step>=3?1:0)-A.assignLine)*sp*0.8;
  A.reqApp     += ((step>=4?1:0)-A.reqApp)*sp*1.3;
  A.appDeploy  += ((step>=5?1:0)-A.appDeploy)*sp;
  A.genBump    += ((step===5?1:0)-A.genBump)*sp*1.4;
}

let sceneOp=0;
function updateNop(){ sceneOp+=((step>=7?0.08:1)-sceneOp)*0.028; }

// ─── Particles ────────────────────────────────────────────────────────────────
const CONNS = [
  // Step 1: POST /clusters → Platform Service (request incoming)
  { fromPt:{ rx:0.04, ry:0.22 }, toPt:PLAT, minS:1, maxS:2, col:'#F59E0B', rate:0.030 },
  // Step 2: Platform Service evaluates CP pool (pings CPs)
  { fromPt:PLAT, toPt:CP[0], minS:2, maxS:2, col:'#60A5FA', rate:0.016 },
  { fromPt:PLAT, toPt:CP[1], minS:2, maxS:2, col:'#60A5FA', rate:0.016 },
  { fromPt:PLAT, toPt:CP[2], minS:2, maxS:2, col:'#60A5FA', rate:0.016 },
  // Step 3: CL-1 assigned to CP-2
  { fromPt:CLUSTER, toPt:CP[1], minS:3, maxS:3, col:'#34D399', rate:0.020 },
  // Step 4: POST /applications → Platform Service
  { fromPt:{ rx:0.04, ry:0.22 }, toPt:PLAT, minS:4, maxS:4, col:'#A78BFA', rate:0.030 },
  // Step 5: AppSet reconciles → APP-2 deployed under CP-2
  { fromPt:CP[1], toPt:APPS[1], minS:5, maxS:6, col:'#34D399', rate:0.018 },
  // Steady: Platform ↔ CPs after assignment
  { fromPt:PLAT, toPt:CP[0], minS:5, maxS:6, col:'#60A5FA', rate:0.008 },
  { fromPt:PLAT, toPt:CP[1], minS:5, maxS:6, col:'#60A5FA', rate:0.010 },
  { fromPt:PLAT, toPt:CP[2], minS:5, maxS:6, col:'#60A5FA', rate:0.008 },
];

let particles=[];

class Particle {
  constructor(c){
    this.col=c.col; this.p=0; this.alive=true;
    this.spd=0.006+Math.random()*0.005;
    this.r=1.6+Math.random()*0.9;
    this.sx=c.fromPt.rx; this.sy=c.fromPt.ry;
    this.ex=c.toPt.rx;   this.ey=c.toPt.ry;
    this.bxOff=(Math.random()-0.5)*0.04;
    this.byOff=(Math.random()-0.5)*0.04;
  }
  pos(){
    const fx=this.sx*W,fy=this.sy*H,tx=this.ex*W,ty=this.ey*H;
    const S=Math.min(W,H);
    const cx=(fx+tx)/2+this.bxOff*S,cy=(fy+ty)/2+this.byOff*S;
    const u=1-this.p;
    return {x:u*u*fx+2*u*this.p*cx+this.p*this.p*tx, y:u*u*fy+2*u*this.p*cy+this.p*this.p*ty};
  }
  update(){ this.p+=this.spd; if(this.p>=1)this.alive=false; }
  draw(){
    const {x,y}=this.pos(), a=Math.sin(this.p*Math.PI);
    ctx.save();
    ctx.globalAlpha=a*0.28; ctx.fillStyle=this.col;
    ctx.shadowColor=this.col; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(x,y,this.r*2.4,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=a*0.92; ctx.shadowBlur=5;
    ctx.beginPath(); ctx.arc(x,y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function maybeSpawn(){
  if(step>=7)return;
  CONNS.forEach(c=>{
    if(step<c.minS||step>c.maxS)return;
    if(Math.random()<c.rate)particles.push(new Particle(c));
  });
}

// ─── Draw helpers ─────────────────────────────────────────────────────────────

function drawBg(){ ctx.fillStyle='#080B12'; ctx.fillRect(0,0,W,H); }

function drawPlatService(){
  const op=sceneOp*A.plat; if(op<0.01)return;
  const cx=PLAT.rx*W, cy=PLAT.ry*H, w=210, h=66;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor='rgba(251,191,36,0.40)'; ctx.shadowBlur=12+Math.sin(pulse*.6)*4;
  ctx.fillStyle='rgba(4,10,24,0.98)'; rr(cx-w/2,cy-h/2,w,h,10); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(251,191,36,0.60)'; ctx.lineWidth=1.5;
  rr(cx-w/2,cy-h/2,w,h,10); ctx.stroke();
  ctx.fillStyle='#FBBF24'; ctx.font='700 12px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Platform Service', cx, cy-10);
  ctx.fillStyle='rgba(148,163,184,0.55)'; ctx.font='500 9px Inter,sans-serif';
  ctx.fillText('cluster & application registry', cx, cy+8);

  // API labels at current step
  const apiLabel =
    step>=4 ? 'POST /clusters  ·  POST /applications' :
    step>=1 ? 'POST /clusters' : '';
  if(apiLabel){
    ctx.globalAlpha=op*0.72; ctx.fillStyle='rgba(251,191,36,0.75)';
    ctx.font='500 8.5px "Courier New",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(apiLabel, cx, cy+22);
  }
  ctx.restore();
}

function drawCPNode(cpDef, idx){
  const op=sceneOp*A.cpPool; if(op<0.01)return;
  const cx=cpDef.rx*W, cy=cpDef.ry*H, w=120, h=52;
  const isSelected = idx===1 && A.clAssigned>0.08;
  const col = isSelected ? '#34D399' : '#7DD3FC';
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=`${col}45`; ctx.shadowBlur=10+(isSelected?A.clAssigned*18:0)+Math.sin(pulse*.62)*3;
  ctx.fillStyle='rgba(4,10,24,0.98)'; rr(cx-w/2,cy-h/2,w,h,9); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=col;
  ctx.globalAlpha=op*(isSelected?0.80:0.52); ctx.lineWidth=1.5;
  rr(cx-w/2,cy-h/2,w,h,9); ctx.stroke();
  ctx.globalAlpha=op;
  ctx.fillStyle=col; ctx.font='700 12px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(cpDef.id, cx, cy-7);
  ctx.fillStyle='rgba(148,163,184,0.55)'; ctx.font='500 9px Inter,sans-serif';
  ctx.fillText(isSelected?'selected ✓':'online', cx, cy+8);
  ctx.restore();
}

function drawCluster(){
  const op=sceneOp*A.clIncoming; if(op<0.01)return;
  const cx=CLUSTER.rx*W, cy=CLUSTER.ry*H, w=150, h=50;
  const assigned=A.clAssigned>0.08;
  const col=assigned?'#34D399':'#F59E0B';
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=`${col}50`; ctx.shadowBlur=10+Math.sin(pulse*.65)*4;
  ctx.fillStyle='rgba(4,10,24,0.98)'; rr(cx-w/2,cy-h/2,w,h,9); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=col;
  ctx.globalAlpha=op*(assigned?0.75:0.60); ctx.lineWidth=1.5;
  rr(cx-w/2,cy-h/2,w,h,9); ctx.stroke();
  ctx.globalAlpha=op;
  ctx.fillStyle=col; ctx.font='700 12px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('CL-1', cx, cy-7);
  ctx.fillStyle='rgba(148,163,184,0.55)'; ctx.font='500 9px Inter,sans-serif';
  ctx.fillText(assigned?'→ CP-2':'pending assignment', cx, cy+8);
  ctx.restore();
}

function drawAssignmentBox(){
  const op=sceneOp*A.clIncoming*(step>=2?1:0); if(op<0.01)return;
  const bx=0.04*W, by=0.62*H, bw=0.28*W, bh=0.24*H;
  ctx.save(); ctx.globalAlpha=op*0.70;
  ctx.strokeStyle='rgba(148,163,184,0.20)'; ctx.lineWidth=1; ctx.setLineDash([4,10]);
  rr(bx,by,bw,bh,10); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(148,163,184,0.30)'; ctx.font='700 9px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Cluster Assignment', bx+bw/2, by+16);
  const params=['region','load','capacity','availability'];
  params.forEach((p,i)=>{
    const active = step>=2;
    ctx.globalAlpha=op*(active?0.70:0.35);
    ctx.fillStyle=active?'rgba(148,163,184,0.80)':'rgba(148,163,184,0.40)';
    ctx.font='500 9.5px Inter,sans-serif';
    ctx.fillText(`· ${p}`, bx+bw/2, by+34+i*16);
  });
  if(step>=3){
    ctx.globalAlpha=op*A.clAssigned;
    ctx.fillStyle='rgba(52,211,153,0.12)'; rr(bx+8,by+bh-34,bw-16,26,5); ctx.fill();
    ctx.strokeStyle='rgba(52,211,153,0.50)'; ctx.lineWidth=0.8;
    rr(bx+8,by+bh-34,bw-16,26,5); ctx.stroke();
    ctx.fillStyle='#34D399'; ctx.font='600 9px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('CL-1 → CP-2 selected', bx+bw/2, by+bh-21);
  }
  ctx.restore();
}

function drawAssignLine(){
  const op=sceneOp*A.assignLine; if(op<0.01)return;
  // Line from CL-1 to CP-2
  const sx=CLUSTER.rx*W+(75), sy=CLUSTER.ry*H;
  const ex=CP[1].rx*W-60,   ey=CP[1].ry*H;
  ctx.save(); ctx.globalAlpha=op*0.60;
  ctx.strokeStyle='rgba(52,211,153,0.65)'; ctx.lineWidth=1.5; ctx.setLineDash([6,9]);
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.setLineDash([]);
  // Arrowhead
  const ang=Math.atan2(ey-sy,ex-sx);
  ctx.globalAlpha=op*0.75; ctx.fillStyle='#34D399';
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-9*Math.cos(ang-0.4),ey-9*Math.sin(ang-0.4));
  ctx.lineTo(ex-9*Math.cos(ang+0.4),ey-9*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawAppNode(app){
  const op=sceneOp*A.appDeploy; if(op<0.01)return;
  const cx=app.rx*W, cy=app.ry*H, w=100, h=40;
  const col=app.cpIdx===1?'#A78BFA':'#60A5FA';
  const isNew=app.cpIdx===1;
  ctx.save(); ctx.globalAlpha=op;
  ctx.shadowColor=`${col}50`; ctx.shadowBlur=8+(isNew?A.appDeploy*14:0);
  ctx.fillStyle='rgba(4,10,24,0.98)'; rr(cx-w/2,cy-h/2,w,h,7); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle=col;
  ctx.globalAlpha=op*0.60; ctx.lineWidth=1.5;
  rr(cx-w/2,cy-h/2,w,h,7); ctx.stroke();
  ctx.globalAlpha=op;
  ctx.fillStyle=col; ctx.font='700 11px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(app.label, cx, cy-5);
  ctx.fillStyle='rgba(148,163,184,0.55)'; ctx.font='500 8.5px Inter,sans-serif';
  ctx.fillText(isNew?'deployed ✓':'running', cx, cy+8);
  ctx.restore();
}

function drawGenBump(){
  const op=sceneOp*A.genBump; if(op<0.01)return;
  // Show generation bump badge near CP-2
  const cx=CP[1].rx*W, cy=CP[1].ry*H-38;
  const w=160, h=22;
  ctx.save(); ctx.globalAlpha=op;
  ctx.fillStyle='rgba(167,139,250,0.14)'; rr(cx-w/2,cy-h/2,w,h,4); ctx.fill();
  ctx.strokeStyle='rgba(167,139,250,0.50)'; ctx.lineWidth=0.8;
  rr(cx-w/2,cy-h/2,w,h,4); ctx.stroke();
  ctx.fillStyle='#A78BFA'; ctx.font='700 8.5px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('generation bump → AppSet reconciles', cx, cy);
  ctx.restore();
}

function drawCPLine(cpDef){
  const op=sceneOp*A.cpPool; if(op<0.01)return;
  // Vertical line from Platform Service down to CP node
  const sx=PLAT.rx*W, sy=PLAT.ry*H+33;
  const ex=cpDef.rx*W, ey=cpDef.ry*H-26;
  ctx.save(); ctx.globalAlpha=op*0.10;
  ctx.strokeStyle='rgba(96,165,250,0.35)'; ctx.lineWidth=1; ctx.setLineDash([4,10]);
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
}

function drawAppLines(){
  const op=sceneOp*A.appDeploy; if(op<0.01)return;
  APPS.forEach(app=>{
    const cx=CP[app.cpIdx].rx*W, cy=CP[app.cpIdx].ry*H+26;
    const tx=app.rx*W, ty=app.ry*H-20;
    ctx.save(); ctx.globalAlpha=op*0.12;
    ctx.strokeStyle='rgba(96,165,250,0.35)'; ctx.lineWidth=1; ctx.setLineDash([3,8]);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  });
}

// ─── Step / UI ────────────────────────────────────────────────────────────────
let step=0;
const MAX_STEPS=8;
let t=0, pulse=0;

const LABELS=[
  'Platform Service manages the CP pool — clusters and applications register through it',
  'POST /clusters — onboard CL-1 with parameters: region, load, availability…',
  'Assignment algorithm evaluates the CP pool using the provided parameters',
  'CL-1 is assigned to CP-2 — the best match based on the parameters',
  'POST /applications — create an application bound to CL-1',
  'App derives CP-2 via CL-1 → CP-2 relationship; generation bumped → AppSet reconciles',
  'APP-2 deployed to CP-2 — application follows its cluster',
  '',
];

const stepLabelEl=document.getElementById('step-label');
const narrativeEl=document.getElementById('narrative');
const narTitle=document.getElementById('nar-title');
const narSub=document.getElementById('nar-sub');
const progressEl=document.getElementById('progress');
const hintEl=document.getElementById('hint');

for(let i=0;i<MAX_STEPS;i++){
  const d=document.createElement('div'); d.className='dot'; d.id='dot'+i;
  progressEl.appendChild(d);
}

function updateUI(){
  stepLabelEl.textContent=step<7?LABELS[step]:'';
  if(step===7){
    narTitle.textContent='Cluster assignment is intelligent. Applications follow their cluster.';
    narSub.textContent='Region, load, capacity — any parameter can drive placement. The application always lands on the right control plane.';
    narrativeEl.classList.add('visible');
  } else {
    narrativeEl.classList.remove('visible');
  }
  for(let i=0;i<MAX_STEPS;i++)
    document.getElementById('dot'+i).className='dot'+(i===step?' active':'');
}

let hintTimer;
function advance(){
  if(step>=MAX_STEPS-1){ window.parent.postMessage({type:'scene-complete'},'*'); return; }
  step++;
  if(step===7) particles=[];
  updateUI();
  hintEl.classList.remove('hidden');
  clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>hintEl.classList.add('hidden'),3000);
}

document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowRight'){ e.preventDefault(); advance(); return; }
  if(e.code==='ArrowLeft'&&step===0){ window.parent.postMessage({type:'scene-back'},'*'); return; }
  if(e.code==='ArrowLeft'&&step>0){ step--; particles=[]; updateUI(); }
});

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  t++; pulse+=0.040;
  tickAnim(); updateNop();
  if(step<7)maybeSpawn();
  particles=particles.filter(p=>{p.update();return p.alive;});
  drawBg();
  CP.forEach((_,i)=>drawCPLine(CP[i]));
  drawAppLines();
  particles.forEach(p=>p.draw());
  drawPlatService();
  CP.forEach((cpDef,i)=>drawCPNode(cpDef,i));
  drawCluster();
  drawAssignmentBox();
  drawAssignLine();
  drawGenBump();
  APPS.forEach(drawAppNode);
}

updateUI();
setTimeout(()=>hintEl.classList.add('hidden'),4000);
loop();

// ── ArrowUp = prev scene, ArrowDown = next scene ─────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowUp')   { e.preventDefault(); window.parent.postMessage({type:'scene-back'},'*'); }
  if (e.code === 'ArrowDown') { e.preventDefault(); window.parent.postMessage({type:'scene-complete'},'*'); }
}, true);
</script>
</body>
</html>
